<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}AUTOPASS - Estacionamiento Inteligente{% endblock %}</title>
    
    <!-- FUENTES E ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Las librerias de CDN por pagina se declaran con el macro de
         components/cdn_libs.html (ver su cabecera: quienes las necesitan). -->

    <!-- ESTILOS BASE MODULARES -->
    <link rel="stylesheet" href="/static/css/base/variables.css">
    <link rel="stylesheet" href="/static/css/base/reset.css">
    <link rel="stylesheet" href="/static/css/base/typography.css">
    <link rel="stylesheet" href="/static/css/base/utilities.css">
    <link rel="stylesheet" href="/static/css/base/animations.css">
    
    <!-- COMPONENTES REUTILIZABLES -->
    <link rel="stylesheet" href="/static/css/components/buttons.css">
    <link rel="stylesheet" href="/static/css/components/cards.css">
    <link rel="stylesheet" href="/static/css/components/forms.css">
    <link rel="stylesheet" href="/static/css/components/select-field.css?v={{ cache_buster }}">
    <link rel="stylesheet" href="/static/css/components/tables.css">
    <link rel="stylesheet" href="/static/css/components/badges.css">
    <link rel="stylesheet" href="/static/css/components/modals.css">
    <link rel="stylesheet" href="/static/css/components/chart-window.css">
    <link rel="stylesheet" href="/static/css/components/skeleton.css?v={{ cache_buster }}">
    <link rel="stylesheet" href="/static/css/components/premium.css?v={{ cache_buster }}">
    <link rel="stylesheet" href="/static/css/components/action-menu.css?v={{ cache_buster }}">
    
    <!-- ESTRUCTURA Y LAYOUT -->
    <link rel="stylesheet" href="/static/css/layout/grid.css">
    <link rel="stylesheet" href="/static/css/layout/sidebar.css?v={{ cache_buster }}">
    <link rel="stylesheet" href="/static/css/layout/header.css?v={{ cache_buster }}">
    <link rel="stylesheet" href="/static/css/layout/standalone.css?v={{ cache_buster }}">
    
    <!-- LEGACY (Se irá vaciando) -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/pages/landing/landing-map.css?v={{ cache_buster }}">

    <!-- LIBRERIAS PRO (graficos, calendarios, QR, mapas): NO van aca.
         Cada pagina declara las que usa con el macro de components/cdn_libs.html,
         para no bajar librerias que esa vista no necesita. -->

    <link rel="icon" type="image/png" href="/static/images/logo.png">
    <link rel="stylesheet" href="/static/css/components/footer.css">
    <link rel="stylesheet" href="/static/css/components/virtual-time.css">

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#dfba6b">
    <link rel="apple-touch-icon" href="/static/images/icons/icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AUTOPASS">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% include "components/virtual_time_banner.html" %}

    {% block content %}{% endblock %}

    {% include "components/modals_global.html" %}

    <!-- SCRIPTS BASE -->
    <script type="module" src="/static/js/api_client.js"></script>
    <script type="module" src="/static/js/main.js"></script>
    {% block extra_scripts %}{% endblock %}

    <!-- REGISTRO SERVICE WORKER + BOTON INSTALAR PWA -->
    <style>
        #pwa-install-btn {
            display: none;
            position: fixed;
            bottom: calc(24px + var(--safe-area-bottom));
            right: calc(24px + var(--safe-area-right));
            z-index: 9999;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--dorado) 0%, var(--dorado-dark) 100%);
            color: #0a0a0a;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(223,186,107,0.35);
            transition: opacity 0.3s, transform 0.3s;
            align-items: center;
            gap: 8px;
        }
        #pwa-install-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
        #pwa-install-btn i { font-size: 1rem; }
    </style>
    <button id="pwa-install-btn" onclick="installPWA()">
        <i class="fas fa-download" aria-hidden="true"></i> INSTALAR APP
    </button>
    <script>
        (function () {
            var deferredPrompt = null;
            var btn = document.getElementById('pwa-install-btn');

            window.addEventListener('beforeinstallprompt', function (e) {
                const allowInstall = !document.body.classList.contains('layout-with-sidebar')
                    && !document.body.classList.contains('no-pwa-install');
                if (!allowInstall) return;
                e.preventDefault();
                deferredPrompt = e;
                btn.style.display = 'flex';
            });

            window.installPWA = function () {
                if (!deferredPrompt) {
                    showToast('Tu navegador no detecta la app. Recargá 2 veces o usá el menú ⋮ → "Instalar app".', 'info');
                    return;
                }
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(function (result) {
                    deferredPrompt = null;
                    btn.style.display = 'none';
                });
            };

            window.addEventListener('appinstalled', function () {
                deferredPrompt = null;
                btn.style.display = 'none';
            });
        })();
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
