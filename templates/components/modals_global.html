<!-- SISTEMA DE NOTIFICACIONES Y MODALES GLOBALES -->
<div id="modal-confirm" class="modal modal--centered" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-content confirm-modal-content">
        <div class="confirm-icon">
            <i class="fas fa-question-circle"></i>
        </div>
        <h3 id="confirm-title">¿Estás seguro?</h3>
        <p id="confirm-msg" class="modal-text">Esta acción no se puede deshacer.</p>
        <div class="confirm-actions">
            <button id="confirm-btn-cancel" class="btn btn--outline" data-modal-close>CANCELAR</button>
            <button id="confirm-btn-ok" class="btn btn--primary">CONFIRMAR</button>
        </div>
    </div>
</div>

<!-- role="status" + aria-live: showToast es la unica salida de exito/error de la
     app y sin live region el lector de pantalla no se enteraba de nada.
     aria-atomic="false" evita releer todo el contenedor al sumar un toast. -->
<div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

<!-- MODAL: ELECCIÓN DE OPCIÓN -->
<div id="modal-choice" class="modal modal--centered" role="dialog" aria-modal="true" aria-labelledby="choice-title">
    <div class="modal-content confirm-modal-content choice-modal-content">
        <div class="confirm-icon">
            <i class="fas fa-money-bill-transfer"></i>
        </div>
        <h3 id="choice-title">Seleccioná una opción</h3>
        <p id="choice-msg" class="modal-text"></p>
        <div id="choice-options" class="choice-grid"></div>
        <div class="confirm-actions">
            <button id="choice-btn-cancel" class="btn btn--outline" data-modal-close>CANCELAR</button>
        </div>
    </div>
</div>
