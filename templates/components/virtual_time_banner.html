<div id="vt-fab" class="vt-fab" onclick="toggleVTModal()" title="Control de tiempo virtual">
    <i class="fas fa-clock" aria-hidden="true"></i>
    <span class="vt-fab-badge" id="vt-fab-badge">ON</span>
</div>

<div id="vt-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="vt-modal-title">
    <div class="modal-content glass-premium">
        <div class="modal-header">
            <div class="flex-row items-center gap-10">
                <div class="header-icon-box sm">
                    <i class="fas fa-clock" aria-hidden="true"></i>
                </div>
                <h3 class="text-dorado" id="vt-modal-title">RELOJ VIRTUAL DEL SISTEMA</h3>
            </div>
            <button type="button" class="close-btn" data-modal-close aria-label="Cerrar" onclick="toggleVTModal()"><i class="fas fa-xmark" aria-hidden="true"></i></button>
        </div>
        <div class="modal-body">
            <div class="vt-big-clock">
                <div class="vt-big-time" id="vt-big-time">--:--:--</div>
                <div class="vt-big-date" id="vt-big-date">---</div>
            </div>

            <div class="vt-info-grid">
                <div class="vt-info-item">
                    <span class="vt-info-label">Hora real del sistema</span>
                    <span class="vt-info-value" id="vt-panel-real">---</span>
                </div>
                <div class="vt-info-item">
                    <span class="vt-info-label">Offset activo</span>
                    <span class="vt-info-value" id="vt-panel-offset">0h 0m</span>
                </div>
            </div>

            <div class="vt-divider"></div>

            <div class="vt-actions-label vt-label-dorado">ADELANTAR TIEMPO</div>
            <div class="vt-actions" id="vt-panel-controls">
                <button class="vt-btn" onclick="advanceVirtualTime(5)">+5 min</button>
                <button class="vt-btn" onclick="advanceVirtualTime(15)">+15 min</button>
                <button class="vt-btn" onclick="advanceVirtualTime(60)">+1 hora</button>
                <button class="vt-btn" onclick="advanceVirtualTime(1440)">+1 día</button>
            </div>

            <div class="vt-actions-label vt-label-amber">RETRASAR TIEMPO</div>
            <div class="vt-actions">
                <button class="vt-btn" onclick="rewindVirtualTime(5)">-5 min</button>
                <button class="vt-btn" onclick="rewindVirtualTime(15)">-15 min</button>
                <button class="vt-btn" onclick="rewindVirtualTime(60)">-1 hora</button>
                <button class="vt-btn" onclick="rewindVirtualTime(1440)">-1 día</button>
            </div>

            <div class="vt-actions-label vt-label-blue">FIJAR FECHA Y HORA EXACTA</div>
            <div class="vt-target-row">
                <input type="datetime-local" id="vt-target-dt" />
                <button class="vt-btn vt-btn-fijar" onclick="setTargetVirtualTime()">FIJAR</button>
            </div>

            <div class="vt-reset-row">
                <button class="vt-btn vt-btn-full vt-btn-danger" onclick="resetVirtualTime()"><i class="fas fa-undo" aria-hidden="true"></i> RESTAURAR TIEMPO REAL</button>
            </div>

            <div id="vt-feedback" class="vt-feedback"></div>
        </div>
    </div>
</div>

<script>
let vtToken = localStorage.getItem('token');
let vtClockInterval = null;

// GLOBAL VIRTUAL TIME HOOK FOR FRONTEND
window.VIRTUAL_TIME_OFFSET = 0;
window.getVirtualNow = function() {
    return new Date(Date.now() + window.VIRTUAL_TIME_OFFSET * 1000);
};

(async function() {
    const fab = document.getElementById('vt-fab');
    // SOLO DASHBOARD Y PERFIL (páginas con sidebar); oculto en landing y demás.
    const allowVT = document.body.classList.contains('layout-with-sidebar');
    // OCULTO PARA CLIENTES (rol "user"): el reloj virtual es una herramienta de administración.
    const isOperational = ['admin', 'local_admin', 'staff'].includes(localStorage.getItem('rol'));
    if (fab) fab.style.display = (vtToken && allowVT && isOperational) ? 'flex' : 'none';
    const controls = document.getElementById('vt-panel-controls');
    if (controls) controls.style.display = (vtToken && isOperational) ? '' : 'none';
    await updateVT();
    setInterval(updateVT, 30000);
})();

async function fetchVT() {
    try {
        const r = await fetch('/v1/system/virtual-time');
        return await r.json();
    } catch(e) { return null; }
}

async function updateVT() {
    const info = await fetchVT();
    if (!info) return;
    window.VIRTUAL_TIME_OFFSET = info.offset_seconds || 0;
    const realDate = new Date(info.real_now);
    const virtDate = new Date(info.virtual_now);

    const bigTime = document.getElementById('vt-big-time');
    const bigDate = document.getElementById('vt-big-date');
    if (bigTime) bigTime.textContent = window.formatTimeSeconds ? window.formatTimeSeconds(virtDate) : virtDate.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit',second:'2-digit', hour12: false});
    if (bigDate) bigDate.textContent = virtDate.toLocaleDateString('es-AR', {weekday:'long',day:'numeric',month:'long',year:'numeric'});

    const panelReal = document.getElementById('vt-panel-real');
    const panelOffset = document.getElementById('vt-panel-offset');
    if (panelReal) panelReal.textContent = window.formatLocalDateTime ? window.formatLocalDateTime(realDate) : realDate.toLocaleString('es-AR');
    if (panelOffset) {
        const abs = Math.abs(info.offset_seconds);
        const h = Math.floor(abs / 3600);
        const m = Math.floor((abs % 3600) / 60);
        const d = Math.floor(h / 24);
        const rh = h % 24;
        panelOffset.textContent = info.offset_seconds === 0 ? '0h 0m' : `${info.offset_seconds > 0 ? '+' : '-'}${d > 0 ? d + 'd ' : ''}${rh}h ${m}m`;
    }

    const badge = document.getElementById('vt-fab-badge');
    const fab = document.getElementById('vt-fab');
    if (badge && fab) {
        if (info.active) {
            badge.style.display = 'inline';
            fab.classList.add('active');
        } else {
            badge.style.display = 'none';
            fab.classList.remove('active');
        }
    }
}

// El cierre del reloj virtual pasa por la puerta unica (openModal/closeModal de
// ui.js, cargado por base.html): es la que registra quien abrio el dialogo y le
// devuelve el foco, y la que sabe que clase necesita cada contenedor para
// centrarse. Siempre frena el refresco del reloj: ese intervalo corre solo
// mientras el dialogo esta abierto.
function cerrarVTModal() {
    if (!document.getElementById('vt-modal')) return;
    closeModal('vt-modal');
    if (vtClockInterval) clearInterval(vtClockInterval);
    vtClockInterval = null;
}

function toggleVTModal() {
    const modal = document.getElementById('vt-modal');
    if (!modal) return;
    if (modal.style.display === 'block') { cerrarVTModal(); return; }
    openModal('vt-modal');
    updateVT();
    if (vtClockInterval) clearInterval(vtClockInterval);
    vtClockInterval = setInterval(updateVT, 2000);
}

function vtHeaders() {
    const t = localStorage.getItem('token');
    return t ? {'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json'} : {'Content-Type': 'application/json'};
}

function showVTFeedback(msg, ok) {
    const fb = document.getElementById('vt-feedback');
    if (!fb) return;
    fb.textContent = msg;
    fb.style.display = 'block';
    fb.style.background = ok ? 'rgba(16,185,129,0.15)' : 'rgba(244, 63, 94,0.15)';
    fb.style.color = ok ? '#10b981' : 'var(--danger)';
    fb.style.border = '1px solid ' + (ok ? 'rgba(16,185,129,0.3)' : 'rgba(244, 63, 94,0.3)');
    setTimeout(() => { fb.style.display = 'none'; }, 3000);
}

async function advanceVirtualTime(minutes) {
    const r = await fetch('/v1/admin/virtual-time/advance', {
        method: 'POST', headers: vtHeaders(),
        body: JSON.stringify({minutes})
    });
    if (r.ok) {
        const label = minutes >= 1440 ? `${minutes/1440} día(s)` : minutes >= 60 ? `${minutes/60} hora(s)` : `${minutes} min`;
        showVTFeedback(`⏱ Tiempo adelantado +${label}`, true);
        await updateVT();
        if (typeof updateNotifBadge === 'function') updateNotifBadge();
        if (typeof window.loadReservations === 'function') window.loadReservations();
        if (typeof window.loadTransactions === 'function') window.loadTransactions();
    }
}

async function rewindVirtualTime(minutes) {
    const r = await fetch('/v1/admin/virtual-time/rewind', {
        method: 'POST', headers: vtHeaders(),
        body: JSON.stringify({minutes})
    });
    if (r.ok) {
        const label = minutes >= 1440 ? `${minutes/1440} día(s)` : minutes >= 60 ? `${minutes/60} hora(s)` : `${minutes} min`;
        showVTFeedback(`⏱ Tiempo retrasado -${label}`, true);
        await updateVT();
        if (typeof updateNotifBadge === 'function') updateNotifBadge();
        if (typeof window.loadReservations === 'function') window.loadReservations();
        if (typeof window.loadTransactions === 'function') window.loadTransactions();
    }
}

async function setTargetVirtualTime() {
    const input = document.getElementById('vt-target-dt');
    if (!input || !input.value) {
        showVTFeedback('Seleccioná fecha y hora', false);
        return;
    }
    const r = await fetch('/v1/admin/virtual-time/set-target', {
        method: 'POST', headers: vtHeaders(),
        body: JSON.stringify({target_datetime: input.value})
    });
    if (r.ok) {
        showVTFeedback(`⏱ Fecha y hora virtual fijada`, true);
        await updateVT();
        if (typeof updateNotifBadge === 'function') updateNotifBadge();
        if (typeof window.loadReservations === 'function') window.loadReservations();
        if (typeof window.loadTransactions === 'function') window.loadTransactions();
    } else {
        showVTFeedback('Error al fijar fecha/hora', false);
    }
}

async function resetVirtualTime() {
    const r = await fetch('/v1/admin/virtual-time/reset', {method: 'POST', headers: vtHeaders()});
    if (r.ok) {
        showVTFeedback('⏱ Tiempo real restaurado', true);
        await updateVT();
        if (typeof updateNotifBadge === 'function') updateNotifBadge();
        if (typeof window.loadReservations === 'function') window.loadReservations();
        if (typeof window.loadTransactions === 'function') window.loadTransactions();
    }
}

// Cerrar al clickear el fondo: mismo camino que el boton X (cerrarVTModal), para
// que el foco vuelva al disparador del reloj igual que en el resto de los dialogos.
document.addEventListener('click', function(e) {
    const modal = document.getElementById('vt-modal');
    if (!modal || modal.style.display !== 'block') return;
    const content = modal.querySelector('.modal-content');
    if (content && !content.contains(e.target) && !e.target.closest('#vt-fab')) {
        cerrarVTModal();
    }
});
</script>
