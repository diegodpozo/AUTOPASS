<header class="header-landing">
    <div class="header-container">
        <button class="mobile-menu-btn" onclick="toggleMobileMenu(event)" aria-label="Abrir menú">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>

        <a href="/" class="header-logo-link">
            <img src="/static/images/logo.png" alt="Logo" class="header-logo-img" loading="lazy" decoding="async">
            <div class="logo-text">AUTOPASS</div>
        </a>

        <nav id="nav-menu">
            <div class="sidebar-header-mobile">
                <img src="/static/images/logo.png" alt="Logo" loading="lazy" decoding="async">
                <span>AUTOPASS</span>
            </div>

            <div class="nav-links">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Inicio</a>
                <a href="/nuestra-red" class="nav-link {% if request.url.path == '/nuestra-red' %}active{% endif %}">Nuestra Red</a>
                <a href="/contacto" class="nav-link {% if request.url.path == '/contacto' %}active{% endif %}">Contacto</a>
            </div>
            
            <div class="nav-actions">
                <div id="auth-guest-actions">
                    <button id="nav-login" class="btn-nav btn-login" onclick="openModal('loginModal')">INICIÁ SESIÓN</button>
                    <button id="nav-register" class="btn-nav btn-register" onclick="openModal('registerModal')">CREÁ TU CUENTA</button>
                </div>
                <div id="auth-user-actions" class="user-nav-hidden">
                    <a href="/perfil" id="nav-profile" class="btn-nav btn-profile"><i class="fas fa-user-circle" aria-hidden="true"></i> Mi Perfil</a>
                    <button id="nav-logout" class="btn-nav btn-logout" onclick="logout()"><i class="fas fa-right-from-bracket" aria-hidden="true"></i> Cerrar Sesión</button>
                </div>
            </div>
        </nav>
    </div>
</header>
