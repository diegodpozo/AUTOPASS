{% macro button(target_id, title) -%}
<div class="report-export-group" role="group" aria-label="EXPORTAR INFORME">
    <button type="button" class="btn btn--outline sm report-btn-export report-btn-export--pdf" onclick="exportVisibleReport('{{ target_id }}', this, 'pdf')" data-report-title="{{ title }}" title="DESCARGAR ESTA VISTA EN PDF (A4)">
        <i class="fas fa-file-pdf" aria-hidden="true"></i> DESCARGAR PDF
    </button>
</div>
{%- endmacro %}
