<!-- SECCIÓN: MIS PUNTOS -->
<div id="section-puntos" class="profile-section">
    <div class="card welcome-card" style="text-align: center; padding: 14px 20px;">
        <div class="welcome-msg">
            <h1 style="justify-content: center; margin-bottom: 8px;"><i class="fas fa-star"></i> MIS PUNTOS AUTOPASS</h1>
        </div>
    </div>

    <div class="points-overview-grid">
        <div class="points-main-card">
            <div class="points-display">
                <span class="points-count" id="points-page-val">0</span>
                <span class="points-label">Puntos Disponibles</span>
            </div>
            <div class="points-info-footer">
                <i class="fas fa-info-circle"></i>
                <span>Sumás 10 puntos por cada $1000 abonados en estadías.</span>
            </div>
        </div>

        <div class="points-stats-mini">
            <div class="p-stat">
                <span class="p-label">Total Acumulado</span>
                <span class="p-val earned" id="total-earned-pts">0</span>
            </div>
            <div class="p-stat">
                <span class="p-label">Puntos Canjeados</span>
                <span class="p-val redeemed" id="total-redeemed-pts">0</span>
            </div>
        </div>
    </div>

    <div id="vouchers-section-wrapper">
        <div class="section-subtitle" style="justify-content: center; margin-left: 0; margin-top: 34px;"><i class="fas fa-ticket"></i> MIS VOUCHERS Y BENEFICIOS</div>
        
        <!-- PESTAÑAS DE VOUCHERS -->
        <div class="voucher-tabs-bar" id="voucher-tabs-bar">
            <button class="voucher-tab-btn active" id="btn-vouchers-vigentes" onclick="switchVoucherTab('VIGENTES')">
                <i class="fas fa-circle-check"></i> Vigentes <span class="voucher-tab-count" id="count-vouchers-vigentes">0</span>
            </button>
            <button class="voucher-tab-btn" id="btn-vouchers-finalizados" onclick="switchVoucherTab('FINALIZADOS')">
                <i class="fas fa-clock-rotate-left"></i> Finalizados <span class="voucher-tab-count" id="count-vouchers-finalizados">0</span>
            </button>
        </div>

        <div id="vouchers-container" style="margin-top: 0;">
            <div id="vouchers-grid" class="vouchers-grid">
                <div class="loading-spinner" style="grid-column: 1 / -1; text-align: center; padding: 30px; color: #888;">
                    <i class="fas fa-circle-notch fa-spin"></i> Cargando vouchers...
                </div>
            </div>
        </div>
    </div>

    <div class="section-subtitle" style="justify-content: center; margin-left: 0; margin-top: 50px;"><i class="fas fa-tags"></i> PROMOCIONES Y BENEFICIOS</div>
    <div class="promo-filter-bar" id="promo-filter-bar" style="display: none;">
        <span class="promo-filter-label"><i class="fas fa-location-dot"></i> Sucursal</span>
        <select id="promo-branch-filter" class="promo-branch-select" onchange="window.applyPromoBranchFilter(this.value)">
            <option value="">Todas las sucursales</option>
        </select>
    </div>
    <div id="promotions-grid" class="promotions-grid">
        <div class="loading-spinner">
            <i class="fas fa-circle-notch fa-spin"></i> Cargando promociones...
        </div>
    </div>

    <div class="section-subtitle" style="justify-content: center; margin-left: 0; margin-top: 50px;">
        <i class="fas fa-clock-rotate-left"></i> HISTORIAL DE PUNTOS
    </div>

    <div id="pts-history-container" style="opacity: 1; margin-top: 0;">
        <div class="card card-narrow" style="padding: 0; overflow: hidden; margin: 0 auto;">
            <div id="points-history-list" class="pts-history-list">
                <p class="text-bold" style="padding: 30px; text-align: center;">Cargando historial...</p>
            </div>
            <!-- NAVEGACIÓN DE HISTORIAL -->
            <div class="pagination-premium" id="pts-pagination" style="display: none; padding: 20px; border-top: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2);">
                <button class="btn-pagination" id="btn-pts-prev" onclick="changePtsPage(-1)">
                    <i class="fas fa-chevron-left"></i> Anterior
                </button>
                <span class="page-info" id="pts-page-info">Página 1 de 1</span>
                <button class="btn-pagination" id="btn-pts-next" onclick="changePtsPage(1)">
                    Siguiente <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
