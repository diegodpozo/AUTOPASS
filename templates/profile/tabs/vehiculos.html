<!-- SECCIÓN: MIS VEHÍCULOS -->
{% from "components/saludo.html" import saludo %}
<div id="section-vehiculos" class="profile-section">
    {% call saludo(icono="fa-car-side", titulo="MIS VEHÍCULOS") %}
        <button class="btn-new-reserva" id="vehicle-form-trigger" onclick="toggleVehicleForm()"><i class="fas fa-plus-circle"></i> NUEVO VEHÍCULO</button>
    {% endcall %}
    <div class="flex-col items-center mt-10">

        <!-- Form Container (Hidden by default, will swap with button) -->
        <div id="vehicle-form-container">
            <div class="card form-compact-premium">
                <h4 class="text-dorado vehicle-form-title">NUEVO VEHÍCULO</h4>
                <form id="add-vehicle-form" onsubmit="addVehicle(event)">
                    <div class="flex-col gap-15">
                        <!-- Selector de Tipo -->
                        <div class="form-group-premium">
                            <label>Tipo de Vehículo</label>
                            <div class="select-wrapper-premium fg-auto">
                                <i id="vehicle-type-icon" class="fas fa-car-side vehicle-type-icon"></i>
                                <select name="tipo" class="input-premium-sm fg-pad-left" onchange="updateVehicleTypeIcon(this.value, '', this.form)">
                                    <option value="Auto">Auto</option>
                                    <option value="Moto">Moto</option>
                                    <option value="Camioneta">Camioneta</option>
                                </select>
                            </div>
                        </div>

                        <!-- Patente y Marca -->
                        <div class="flex-row gap-10 flex-wrap-mobile">
                            <div class="form-group-premium">
                                <label>Patente</label>
                                <div class="input-wrapper-premium">
                                    <input type="text" name="patente" placeholder="ABC 123" required class="input-premium-sm uppercase">
                                </div>
                            </div>
                            <div class="form-group-premium">
                                <label>Marca / Modelo</label>
                                <input type="text" name="marca_modelo" placeholder="Ej: VW Gol" required class="input-premium-sm">
                            </div>
                        </div>
                    </div>
                    <div class="vehicle-form-actions">
                        <button type="button" class="btn btn--outline btn--sm" onclick="toggleVehicleForm()">
                            CANCELAR
                        </button>
                        <button type="submit" class="btn btn--primary btn--sm">
                            CONTINUAR
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card-vehicle-list-wrapper">
            <div id="vehicle-list">
                <p class="text-bold">Cargando flota...</p>
            </div>
        </div>
    </div>
</div>
