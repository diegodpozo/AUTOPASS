<!-- SECCIÓN: MIS VEHÍCULOS -->
<div id="section-vehiculos" class="profile-section">
    <div class="flex-col items-center" style="margin-top: 20px;">
        <!-- Trigger Button (Will hide when clicked) -->
        <div class="register-trigger-card mb-30" onclick="toggleVehicleForm()" id="vehicle-form-trigger" style="background: var(--dorado); color: #000; border-radius: 15px; padding: 15px 40px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: 0.3s; width: fit-content;">
            <i class="fas fa-plus-circle" style="font-size: 1.2rem;"></i>
            <span style="font-weight: 900; letter-spacing: 1px;">NUEVO VEHÍCULO</span>
        </div>

        <!-- Form Container (Hidden by default, will swap with button) -->
        <div id="vehicle-form-container" style="width: 100%; max-width: 450px; display: none; margin-top: 15px; animation: fadeIn 0.4s ease;">
            <div class="card form-compact-premium" style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(197, 160, 89, 0.2); padding: 30px; border-radius: 20px; margin-bottom: 30px;">
                <h4 class="text-dorado" style="text-align: center; margin-bottom: 25px; font-weight: 800; letter-spacing: 1px; font-size: 1rem;">NUEVO VEHÍCULO</h4>
                <form id="add-vehicle-form" onsubmit="addVehicle(event)">
                    <input type="hidden" name="tipo" value="Auto">
                    <div class="flex-col gap-15">
                        <!-- Patente y Marca -->
                        <div class="flex-row gap-10 flex-wrap-mobile" style="justify-content: center;">
                            <div class="form-group-premium" style="gap: 4px; flex: 0 0 35%;">
                                <label style="font-size: 0.65rem; text-align: center; width: 100%; display: block;">Patente</label>
                                <div class="select-wrapper-premium" style="width: 100%;">
                                    <i id="vehicle-type-icon" class="fas fa-car-side" style="left: 10px; display: none; color: var(--dorado); position: absolute; top: 50%; transform: translateY(-50%); font-size: 0.8rem; opacity: 0.8; z-index: 5;"></i>
                                    <input type="text" name="patente" placeholder="ABC 123" required class="input-premium-sm uppercase" style="padding: 10px !important; width: 100%; text-align: center; font-size: 0.9rem;">
                                </div>
                            </div>
                            <div class="form-group-premium" style="gap: 4px; flex: 0 0 55%;">
                                <label style="font-size: 0.65rem; text-align: center; width: 100%; display: block;">Marca / Modelo</label>
                                <input type="text" name="marca_modelo" placeholder="Ej: VW Gol" required class="input-premium-sm" style="padding: 10px !important; text-align: center; width: 100%; font-size: 0.9rem;">
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 30px; display: flex; justify-content: center; gap: 15px;">
                        <button type="button" class="btn btn-outline btn-sm" onclick="toggleVehicleForm()" style="padding: 8px 20px; font-size: 0.75rem; letter-spacing: 0.5px; border-radius: 10px; background: #000; border-color: rgba(255,255,255,0.1);">
                            CANCELAR
                        </button>
                        <button type="submit" class="btn btn-primary btn-sm" style="padding: 8px 25px; font-size: 0.75rem; letter-spacing: 0.5px; border-radius: 10px;">
                            CONTINUAR
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card-vehicle-list-wrapper">
            <div id="vehicle-list">
                <p class="text-bold">Cargando flota...</p>
            </div>
        </div>
    </div>
</div>
