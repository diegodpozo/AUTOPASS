<!-- SECCIÓN: INICIO -->
<div id="section-inicio" class="profile-section active">
    <div class="greeting-premium">
        <h2 id="welcome-greeting">¡HOLA!</h2>
        <p>¡Realizá tu reserva rápido y de manera simple!</p>
    </div>

    <div class="portal-home-grid">
        <!-- LADO IZQUIERDO: ACCIONES RÁPIDAS Y RESERVA -->
        <div class="grid-col booking-side">
            <div id="reserva-form-container" class="open" style="display: block; opacity: 1; max-width: 675px; margin: 0 auto;">
                <!-- (Contenido del formulario de reserva ...) -->
                <div class="modern-reservation-card">

                    <!-- ESTADO SIN VEHÍCULOS -->
                    <div id="reserva-no-vehicles" style="display: none; padding: 40px 30px;">
                        <div class="empty-state-premium">
                            <div class="flex-row gap-20 items-center justify-center" style="flex-wrap: wrap; margin-bottom: 5px;">
                                <div class="empty-icon-box" style="width: 60px; height: 60px;">
                                    <i class="fas fa-motorcycle main-icon" style="font-size: 1.5rem;"></i>
                                    <div class="icon-pulse"></div>
                                </div>
                                <div class="empty-icon-box">
                                    <i class="fas fa-car-rear main-icon"></i>
                                    <div class="icon-pulse"></div>
                                </div>
                                <div class="empty-icon-box" style="width: 60px; height: 60px;">
                                    <i class="fas fa-truck-pickup main-icon" style="font-size: 1.5rem;"></i>
                                    <div class="icon-pulse"></div>
                                </div>
                            </div>
                            <div id="quick-add-info" style="display: none;">
                                <h4>¡UPS! NO TENÉS VEHÍCULOS</h4>
                                <p>Para reservar, primero vinculá una patente a tu cuenta.</p>
                                <button class="btn btn-primary btn-sm mt-15" onclick="showQuickAddVehicle()">
                                    <i class="fas fa-plus-circle"></i> AGREGAR
                                </button>
                            </div>

                            <div id="quick-add-form-container" style="width: 100%; max-width: 450px; margin: 5px auto 0;">
                                <h4 class="text-dorado" style="text-align: center; margin-bottom: 30px;">NUEVO VEHÍCULO</h4>
                                <form id="quick-add-vehicle-form" onsubmit="addVehicle(event, true)" class="form-compact-premium" style="padding: 0; background: transparent; border: none; box-shadow: none;">
                                     <input type="hidden" name="tipo" value="Auto">
                                     <div class="flex-col gap-10">
                                         <!-- Patente y Marca -->
                                         <div class="flex-row gap-8 flex-wrap-mobile" style="justify-content: center;">
                                             <div class="form-group-premium" style="gap: 4px; flex: 0 0 30%;">
                                                 <label style="font-size: 0.65rem; text-align: center; width: 100%; display: block;">Patente</label>
                                                 <div class="select-wrapper-premium" style="width: 100%;">
                                                     <i id="quick-vehicle-type-icon" class="fas fa-car-side" style="left: 10px; display: none; color: var(--dorado); position: absolute; top: 50%; transform: translateY(-50%); font-size: 0.8rem; opacity: 0.8; z-index: 5;"></i>
                                                     <input type="text" name="patente" placeholder="ABC 123" required class="input-premium-sm uppercase" style="padding: 8px 10px !important; width: 100%; text-align: center;">
                                                 </div>
                                             </div>
                                             <div class="form-group-premium" style="gap: 4px; flex: 0 0 50%;">
                                                 <label style="font-size: 0.65rem; text-align: center; width: 100%; display: block;">Marca / Modelo</label>
                                                 <input type="text" name="marca_modelo" placeholder="Ej: VW Gol" required class="input-premium-sm" style="padding: 8px 10px !important; text-align: center; width: 100%;">
                                             </div>
                                         </div>
                                     </div>
                                     <div class="flex-row justify-center mt-15">
                                         <button type="submit" class="btn btn-primary btn-sm" style="padding: 8px 25px; font-size: 0.75rem; letter-spacing: 0.5px;">CONTINUAR</button>
                                     </div>
                                 </form>
                            </div>
                        </div>
                    </div>

                    <!-- FORMULARIO DE RESERVA -->
                    <div id="reserva-form-content" style="display: none; padding: 40px;">
                        <form class="reservation-form-modern" onsubmit="createReservation(event)">
                            <div class="flex-col items-center gap-20">
                                <!-- Vehículo centrado -->
                                <div class="form-group-premium" style="width: 100%; max-width: 280px; align-items: center;">
                                    <label style="text-align: center; width: 100%; display: block; font-size: 0.9rem;">Vehículo</label>
                                    <div class="select-wrapper-premium" style="width: 100%;">
                                        <i class="fas fa-car" style="left: 15px;"></i>
                                        <select class="res-vehicle" required style="padding: 12px 15px 12px 42px !important; font-size: 0.9rem; text-align-last: center;">
                                            <option value="">Cargando flota...</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <!-- Punto y Tipo centrados -->
                                <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; width: 100%;">
                                    <div class="form-group-premium" style="margin-bottom: 0; flex: 1; max-width: 330px; align-items: center;">
                                        <label style="text-align: center; width: 100%; display: block;">Punto AutoPass</label>
                                        <div class="select-wrapper-premium" style="width: 100%;">
                                            <i class="fas fa-location-dot" style="left: 15px;"></i>
                                            <select class="res-sucursal" required style="padding: 12px 15px 12px 42px !important; font-size: 0.9rem; text-align-last: center;">
                                                <option value="">Cargando sucursales...</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group-premium" style="margin-bottom: 0; flex: 1; max-width: 144px; align-items: center;">
                                        <label style="text-align: center; width: 100%; display: block;">Tipo de Estadía</label>
                                        <div class="select-wrapper-premium" style="width: 100%;">
                                            <i class="fas fa-clock" style="left: 15px;"></i>
                                            <select class="res-type" required style="padding: 12px 15px 12px 42px !important; font-size: 0.9rem; text-align-last: center;">
                                                <option value="" selected disabled hidden>Seleccioná...</option>
                                                <option value="hora">Hora</option>
                                                <option value="dia">Día</option>
                                                <option value="semana">Semana</option>
                                                <option value="quincena">Quincena</option>
                                                <option value="mes">Mes</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!-- CAMPOS DINÁMICOS SEGÚN TIPO DE RESERVA -->
                                <div id="dynamic-fields-premium" style="width: 100%; display: flex; justify-content: center;">
                                    <div id="hourly-fields" class="dynamic-row-premium" data-display="flex" style="display:none; gap: 20px; justify-content: center; width: 100%;">
                                        <div class="form-group-premium" style="max-width: 120px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block;">Día</label>
                                            <input type="text" class="res-date-only input-premium" placeholder="Fecha...">
                                        </div>
                                        <div class="form-group-premium" style="max-width: 100px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block;">Hora Inicio</label>
                                            <input type="text" class="res-time-only input-premium" placeholder="12:00">
                                        </div>
                                        <div class="form-group-premium" style="max-width: 60px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block;">Cantidad</label>
                                            <input type="number" class="res-hours-qty input-premium" min="1" max="24" placeholder="2">
                                        </div>
                                    </div>
                                    
                                    <div id="daily-fields" class="dynamic-row-premium" style="display:none; justify-content: center; width: 100%;">
                                        <div class="form-group-premium" style="align-items: center; display: flex; flex-direction: column; width: 100%; max-width: 350px;">
                                            <label style="text-align: center; width: 100%; display: block;">Día de Estadía</label>
                                            <input type="text" class="res-day-only input-premium" placeholder="Seleccioná día...">
                                        </div>
                                    </div>

                                    <div id="weekly-fields" class="dynamic-row-premium" data-display="flex" style="display:none; justify-content: center; gap: 20px; width: 100%;">
                                        <div class="form-group-premium" style="max-width: 180px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Inicia el día</label>
                                            <input type="text" class="res-week-start input-premium" placeholder="Fecha inicio...">
                                        </div>
                                        <div class="form-group-premium" style="max-width: 180px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Finaliza</label>
                                            <input type="text" class="res-week-end input-premium-readonly" readonly>
                                        </div>
                                    </div>
                                    <!-- Otros campos similares centrados -->
                                    <div id="fortnight-fields" class="dynamic-row-premium" data-display="flex" style="display:none; justify-content: center; gap: 20px; width: 100%;">
                                        <div class="form-group-premium" style="max-width: 180px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Inicia el día</label>
                                            <input type="text" class="res-fortnight-start input-premium" placeholder="Fecha inicio...">
                                        </div>
                                        <div class="form-group-premium" style="max-width: 180px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Finaliza</label>
                                            <input type="text" class="res-fortnight-end input-premium-readonly" readonly>
                                        </div>
                                    </div>
                                    <div id="month-fields" class="dynamic-row-premium" data-display="flex" style="display:none; justify-content: center; gap: 20px; width: 100%;">
                                        <div class="form-group-premium" style="max-width: 180px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Inicia el día</label>
                                            <input type="text" class="res-month-start input-premium" placeholder="Fecha inicio...">
                                        </div>
                                        <div class="form-group-premium" style="max-width: 180px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Finaliza</label>
                                            <input type="text" class="res-month-end input-premium-readonly" readonly>
                                        </div>
                                    </div>
                                    <div id="standard-fields" class="dynamic-row-premium" data-display="flex" style="display:none; justify-content: center; gap: 20px; width: 100%;">
                                        <div class="form-group-premium" style="max-width: 200px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Inicio</label>
                                            <input type="text" class="res-start input-premium" placeholder="Fecha y hora...">
                                        </div>
                                        <div class="form-group-premium" style="max-width: 200px; align-items: center;">
                                            <label style="text-align: center; width: 100%; display: block; font-size: 0.75rem;">Fin</label>
                                            <input type="text" class="res-end input-premium" placeholder="Fecha y hora...">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="reservation-footer-premium" style="margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; flex-direction: column; gap: 20px; align-items: center;">
                                <div class="price-summary-premium" style="text-align: center;">
                                    <span class="total-label" style="display: block; margin-bottom: 5px;">Total Estimado:</span>
                                    <span class="total-amount" id="reserva-total-est" style="font-size: 2rem;">$ ---</span>
                                </div>
                                <button type="submit" class="btn-confirm-premium" style="width: 100%; max-width: 350px; justify-content: center; height: 55px; font-size: 1.1rem;">
                                    <span>CONTINUAR</span>
                                    <i class="fas fa-chevron-right" style="margin-left: 15px;"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Botones de Utilidad Secundaria -->
            <div class="quick-actions-grid mt-20">
                <div class="action-btn-premium" onclick="openRechargeModal()">
                    <i class="fas fa-wallet"></i>
                    <span>Cargar Saldo</span>
                </div>
                <div class="action-btn-premium" onclick="showSection('puntos', document.querySelector('.nav-item[onclick*=\'puntos\']'))">
                    <i class="fas fa-gift"></i>
                    <span>Beneficios</span>
                </div>
            </div>
        </div>

        <div class="grid-col map-and-stats-side">
            <div class="card portal-map-card">
                <div class="map-hint-floating">
                    <span class="hint-pulse"></span>
                    <span class="hint-text">¡Estacioná en tu zona!</span>
                    <i class="fas fa-hand-point-down hand-pointing"></i>
                </div>
                <div id="portal-map" class="portal-map-container">
                    <!-- Leaflet renderiza aquí -->
                </div>
                <!-- Cuadro de información dinámica -->
                <div class="map-overlay">
                    <h4><i class="fas fa-building"></i> Playa</h4>
                    <p>Cargando dirección...</p>
                </div>
            </div>
        </div>
    </div>
</div>
