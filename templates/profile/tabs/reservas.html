<!-- SECCIÓN: MIS RESERVAS -->
<div id="section-reservas" class="profile-section">
    <div class="card welcome-card">
        <div class="welcome-msg">
            <h1><i class="fas fa-calendar-days"></i> MIS RESERVAS</h1>
        </div>
    </div>

    <div class="reserva-stats-grid">
        <div class="res-stat-card">
            <div class="res-stat-value-wrap">
                <i class="fas fa-car-side"></i>
                <span class="res-stat-value" id="stat-res-active">0</span>
            </div>
            <span class="res-stat-label">En Curso</span>
        </div>
        <div class="res-stat-card">
            <div class="res-stat-value-wrap">
                <i class="fas fa-calendar-check"></i>
                <span class="res-stat-value" id="stat-res-upcoming">0</span>
            </div>
            <span class="res-stat-label">Próximas</span>
        </div>
    </div>

    <div class="flex-col">
        <div id="container-res-featured">
            <div class="section-subtitle"><i class="fas fa-star"></i> ESTADÍA ACTUAL</div>
            <div id="reservation-featured-list"></div>
        </div>

        <div class="section-subtitle"><i class="fas fa-calendar-list"></i> TUS PRÓXIMAS RESERVAS</div>
        <div id="reservation-list-active" class="reserva-grid-modern">
            <div class="skeleton-grid" aria-hidden="true">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>

        <div class="section-subtitle subtitle-spaced">
            <i class="fas fa-clock-rotate-left"></i> HISTORIAL DE ESTADÍAS
        </div>

        <div id="historial-container">
            <div class="card card-narrow">
                <div class="history-filters-premium no-print">
                    <div class="filter-group-premium">
                        <label>Desde</label>
                        <input type="date" id="history-filter-from" class="filter-input-premium">
                    </div>
                    <div class="filter-group-premium">
                        <label>Hasta</label>
                        <input type="date" id="history-filter-to" class="filter-input-premium">
                    </div>
                    <div class="filter-actions-premium">
                        <button class="btn btn--primary btn--sm" onclick="applyHistoryFilters()" title="Filtrar"><i class="fas fa-arrow-right"></i></button>
                        <button class="btn btn--outline btn--sm" onclick="resetHistoryFilters()" title="Limpiar"><i class="fas fa-rotate-left"></i></button>
                    </div>
                </div>
                <div id="reservation-list-history" class="flex-col">
                    <div aria-hidden="true">
                        <div class="skeleton skeleton-list-item"></div>
                        <div class="skeleton skeleton-list-item"></div>
                        <div class="skeleton skeleton-list-item"></div>
                    </div>
                </div>
                <div id="historial-pagination" class="pagination">
                    <button class="btn-pagination" onclick="historialPage(-1)" id="historial-prev">
                        <i class="fas fa-chevron-left"></i> ANTERIOR
                    </button>
                    <span id="historial-page-info" class="page-info">Página 1</span>
                    <button class="btn-pagination" onclick="historialPage(1)" id="historial-next">
                        SIGUIENTE <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
