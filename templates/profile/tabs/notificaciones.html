<div id="section-notificaciones" class="profile-section">
    <div class="card welcome-card" style="text-align: center; padding: 14px 20px;">
        <div class="welcome-msg">
            <h1 style="justify-content: center; margin-bottom: 0;">
                <i class="fas fa-bell" style="color: var(--dorado); margin-right: 10px;"></i> CENTRO DE NOTIFICACIONES
            </h1>
        </div>
    </div>

    <!-- FILTROS DE CATEGORIA -->
    <div class="notif-filter-bar" style="margin-top: 15px;">
        <div class="notif-filter-chips">
            <button class="notif-chip active" data-filter="ALL" onclick="filterNotifs('ALL', this)">
                <i class="fas fa-layer-group"></i> Todas
            </button>
            <button class="notif-chip" data-filter="UNREAD" onclick="filterNotifs('UNREAD', this)">
                <i class="fas fa-envelope"></i> No leídas
            </button>
            <button class="notif-chip" data-filter="RESERVATION" onclick="filterNotifs('RESERVATION', this)">
                <i class="fas fa-calendar-alt"></i> Reservas
            </button>
            <button class="notif-chip" data-filter="FINANCE" onclick="filterNotifs('FINANCE', this)">
                <i class="fas fa-wallet"></i> Pagos & Saldo
            </button>
            <button class="notif-chip" data-filter="SUPPORT" onclick="filterNotifs('SUPPORT', this)">
                <i class="fas fa-headset"></i> Soporte
            </button>
        </div>
        <div class="notif-filter-actions">
            <button class="btn-notif-mark-read" onclick="markAllNotifRead()" id="btn-mark-all-read" disabled>
                <i class="fas fa-check"></i> Marcar como leídas
            </button>
            <button class="btn-notif-clear-read" onclick="clearReadNotifs()" id="btn-clear-read-notifs" disabled>
                <i class="fas fa-trash-alt"></i> Borrar notificaciones
            </button>
        </div>
    </div>

    <div id="notifications-container">
        <div class="loading-spinner" id="notif-loading">
            <i class="fas fa-spinner fa-spin"></i> Cargando notificaciones...
        </div>
    </div>
</div>
