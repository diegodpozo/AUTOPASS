<!-- PESTAÑA: CONFIGURACIÓN (Overhaul v8.3.3) -->
<div id="tab-settings" class="tab-view">
    <div class="content-wrapper">
        <div class="card glass-premium mx-auto">

            <div class="card-header-premium">
                <div class="header-info-group">
                    <div class="header-icon"><i class="fas fa-gears" aria-hidden="true"></i></div>
                    <div class="header-text">
                        <h3 class="text-dorado">CONFIGURACIÓN</h3>
                    </div>
                </div>
            </div>

            <!-- NAVEGACIÓN INTERNA DE CONFIGURACIÓN -->
            <div class="flex-row flex-wrap justify-center gap-10 p-15 settings-tabs-bar">
                <button class="btn-tab-mini active" onclick="switchSettingsTab('rates', this)">
                    <i class="fas fa-hand-holding-dollar mr-8" aria-hidden="true"></i> TARIFARIO
                </button>
                <button class="btn-tab-mini" onclick="switchSettingsTab('floors', this)">
                    <i class="fas fa-layer-group mr-8" aria-hidden="true"></i> PLAZAS
                </button>
                <button class="btn-tab-mini" onclick="switchSettingsTab('monitoring', this)">
                    <i class="fas fa-video mr-8" aria-hidden="true"></i> MONITOREO
                </button>
                <button class="btn-tab-mini" onclick="switchSettingsTab('system', this)">
                    <i class="fas fa-microchip mr-8" aria-hidden="true"></i> SISTEMA
                </button>
            </div>

            <div class="settings-body p-30">
                <!-- SECCIÓN 1: TARIFARIO (BIMODAL) -->
                {% include "dashboard/tabs/settings/settings_rates.html" %}

                <!-- SECCIÓN 2: GESTIÓN DE PLAZAS -->
                {% include "dashboard/tabs/settings/settings_floors.html" %}

                <!-- SECCIÓN 3: CONFIGURACIÓN DE CÁMARAS -->
                {% include "dashboard/tabs/settings/settings_monitoring.html" %}

                <!-- SECCIÓN 4: ESTADO DEL SISTEMA -->
                {% include "dashboard/tabs/settings/settings_system.html" %}
            </div>
        </div>
    </div>
</div>
