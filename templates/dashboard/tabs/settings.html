<!-- MODAL: AGREGAR PISO -->
<div id="modal-add-floor" class="modal">

            <div class="flex-row items-center gap-10">

            </div>
            <div class="flex-row gap-20">

                    <label>CAP. AUTOS</label>
                    <div class="input-with-icon">

                        <input type="number" id="floor-cap-autos" class="input-premium" value="20" required>
                    </div>
                </div>
                <div class="form-group-premium flex-1">

                    <div class="input-with-icon">

            </div>

                <button type="button" class="btn btn-outline" onclick="closeModal('modal-add-floor')">CANCELAR</button>

            </div>
        </form>
    </div>
