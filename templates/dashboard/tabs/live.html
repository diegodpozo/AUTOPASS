<!-- PESTAÑA: MONITOREO -->
<div id="tab-live" class="tab-view">
    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px; gap: 12px; flex-wrap: wrap;">
        <a href="/estadisticas-ocr" onclick="event.preventDefault(); window.open('/estadisticas-ocr','_blank');" class="btn btn-premium sm" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 8px 16px;">
            <i class="fas fa-microchip text-dorado"></i> ESTADÍSTICAS OCR
        </a>
        <a href="/monitoreo" target="_blank" class="btn btn-premium sm" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 8px 16px;">
            <i class="fas fa-tower-observation" style="color: var(--dorado);"></i> ABRIR MONITOR MULTI-CÁMARA
        </a>
    </div>

    <!-- ESTADÍSTICAS DE CAPACIDAD EN FILA -->
    <div class="stats-row" style="display: flex; gap: 15px; margin-bottom: 20px;">
        <div class="stat-card-premium" style="flex: 1;" title="Disponibilidad de cocheras para autos">
            <div class="stat-icon"><i class="fas fa-car"></i></div>
            <div class="stat-info">
                <span class="label">Autos</span>
                <span class="value" id="stat-free-total">-- / --</span>
            </div>
            <div class="stat-progress">
                <div class="progress-bar"><div id="bar-free" class="progress-fill" style="width: 0%"></div></div>
            </div>
            <div class="stat-sub-labels">
                <span class="text-xs text-muted">Libres</span>
                <span id="stat-free" class="text-xs" style="display:none"></span>
                <span id="stat-total" class="text-xs" style="display:none"></span>
            </div>
        </div>

        <div class="stat-card-premium" style="flex: 1;" title="Disponibilidad de lugares para motos">
            <div class="stat-icon"><i class="fas fa-motorcycle"></i></div>
            <div class="stat-info">
                <span class="label">Motos</span>
                <span class="value" id="stat-free-total-motos">-- / --</span>
            </div>
            <div class="stat-progress">
                <div class="progress-bar"><div id="bar-free-motos" class="progress-fill" style="width: 0%"></div></div>
            </div>
            <div class="stat-sub-labels">
                <span class="text-xs text-muted">Libres</span>
                <span id="stat-free-motos" class="text-xs" style="display:none"></span>
                <span id="stat-total-motos" class="text-xs" style="display:none"></span>
            </div>
        </div>

        <div class="stat-card-premium" style="flex: 1;" title="Disponibilidad de lugares para camionetas">
            <div class="stat-icon"><i class="fas fa-truck-pickup"></i></div>
            <div class="stat-info">
                <span class="label">Camionetas</span>
                <span class="value" id="stat-free-total-camionetas">-- / --</span>
            </div>
            <div class="stat-progress">
                <div class="progress-bar"><div id="bar-free-camionetas" class="progress-fill" style="width: 0%"></div></div>
            </div>
            <div class="stat-sub-labels">
                <span class="text-xs text-muted">Libres</span>
                <span id="stat-free-camionetas" class="text-xs" style="display:none"></span>
                <span id="stat-total-camionetas" class="text-xs" style="display:none"></span>
            </div>
        </div>
    </div>

    <div class="monitoring-grid">
        <!-- SECCIÓN IZQUIERDA: CONTROL -->
        <div class="monitoring-main">

            <!-- CONTENEDOR DE PESTAÑAS PARA LISTADOS -->
            <div class="card mt-10">
                <div class="tabs-header-premium" style="display: flex; justify-content: space-between; align-items: center;">
                    <div class="tabs-buttons-group" style="display: flex; gap: 5px;">
                        <button class="tab-btn active" onclick="switchMonitorTab('occ', this)">
                            <i class="fas fa-car-side"></i> VEHÍCULOS ESTACIONADOS
                        </button>
                        <button class="tab-btn" onclick="switchMonitorTab('logs', this)">
                            <i class="fas fa-list-ul"></i> ÚLTIMOS MOVIMIENTOS
                        </button>
                    </div>

                    <!-- BUSCADORES INTEGRADOS EN LA CABECERA -->
                    <div class="tabs-actions-group" style="padding-right: 15px;">
                        <!-- Buscador Ocupación -->
                        <div id="search-container-occ" class="monitor-tab-content active">
                            <div class="search-box-premium sm" title="Filtrar vehículos por patente">
                                <i class="fas fa-search"></i>
                                <input type="text" id="occ-search" placeholder="Buscar patente..." onkeyup="filterOccupancy(this.value)">
                            </div>
                        </div>
                        <!-- Buscador Movimientos -->
                        <div id="search-container-logs" class="monitor-tab-content">
                            <div class="search-box-premium sm" title="Filtrar movimientos recientes">
                                <i class="fas fa-search"></i>
                                <input type="text" placeholder="Buscar patente..." onkeyup="filterLogs(this.value)">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SUB-PESTAÑA: VEHÍCULOS ESTACIONADOS -->
                <div id="monitor-tab-occ" class="monitor-tab-content active">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Vehículo</th>
                                    <th>Ingreso</th>
                                    <th>Permanencia</th>
                                    <th>Deuda</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="occ-list">
                                <tr><td colspan="5" class="text-center py-20">No hay vehículos en el predio.</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Paginación Ocupación -->
                    <div id="occ-pagination" class="pagination-premium" style="padding: 10px 25px 20px; display: flex; justify-content: center; gap: 10px;"></div>
                </div>

                <!-- SUB-PESTAÑA: ÚLTIMOS MOVIMIENTOS -->
                <div id="monitor-tab-logs" class="monitor-tab-content">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr><th>Hora</th><th>Patente</th><th>Evento</th><th>Abono</th><th>Info</th></tr>
                            </thead>
                            <tbody id="live-logs">
                                <tr><td colspan="5" class="text-center py-20">Esperando actividad...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <!-- Paginación Movimientos -->
                    <div id="logs-pagination" class="pagination-premium" style="padding: 10px 25px 20px; display: flex; justify-content: center; gap: 10px;"></div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN DERECHA: CONTROL -->
        <div class="monitoring-side">
            <!-- PANEL DE CONTROL MANUAL -->
            <div class="card mt-0">
                <div class="card-header-premium" style="padding: 15px 20px;">
                    <div class="header-info-group">
                        <div class="header-icon" style="font-size: 0.9rem;"><i class="fas fa-keyboard"></i></div>
                        <div class="header-text">
                            <h3 style="font-size: 0.85rem;">INGRESO MANUAL</h3>
                        </div>
                    </div>
                </div>
                
                <div id="manual-ops-content" style="background: rgba(0,0,0,0.1);">
                    <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
                        <!-- Ingreso Manual -->
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; gap: 10px; align-items: center;">
                                <input type="text" id="manual-plate" placeholder="ABC-123" class="input-premium uppercase" style="height: 42px; font-size: 0.9rem; text-align: center; flex: 1;">
                                <button class="btn btn-premium sm" onclick="manualEntry()" style="height: 42px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;" title="Registrar ingreso de vehículo sin ALPR">
                                    <i class="fas fa-sign-in-alt"></i> ENTRAR
                                </button>
                            </div>
                            <div id="manual-floor-group" style="display: none; margin-top: 5px;">
                                <label style="font-size: 0.6rem; color: #888; text-transform: uppercase; font-weight: 700;">PISO / SECTOR</label>
                                <select id="manual-floor" class="select-premium-sm" style="width: 100%; height: 36px; margin-top: 4px;"></select>
                            </div>
                        </div>

                        <div style="width: 100%; height: 1px; background: rgba(255,255,255,0.05);"></div>

                        <!-- CONTROL DE BARRERAS FÍSICAS -->
                        <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 2px;">
                            <div style="font-size: 0.65rem; color: var(--dorado); font-weight: 800; letter-spacing: 0.8px; text-align: center; text-transform: uppercase;">
                                CONTROL DE BARRERAS FÍSICAS
                            </div>
                            
                            <!-- BARRERA ENTRADA -->
                            <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 6px 10px; border-radius: 14px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <img id="icon-barrier-entry" src="/static/images/barrera baja.png" style="width: 24px; filter: brightness(0) invert(1);">
                                    <span style="font-size: 0.7rem; color: var(--text); font-weight: 800;">ENTRADA</span>
                                </div>
                                <div style="display: flex; gap: 7px;">
                                    <button class="btn btn-action-mini success" onclick="openBarrier('ENTRADA', 'OPEN')" title="Abrir Barrera de Entrada" style="padding: 6px 36px; font-size: 0.65rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
                                        <i class="fas fa-lock-open"></i> ABRIR
                                    </button>
                                    <button class="btn btn-action-mini danger" onclick="openBarrier('ENTRADA', 'CLOSE')" title="Cerrar Barrera de Entrada" style="padding: 6px 36px; font-size: 0.65rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
                                        <i class="fas fa-lock"></i> CERRAR
                                    </button>
                                </div>
                            </div>

                            <!-- BARRERA SALIDA -->
                            <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 6px 10px; border-radius: 14px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <img id="icon-barrier-exit" src="/static/images/barrera baja.png" style="width: 24px; filter: brightness(0) invert(1);">
                                    <span style="font-size: 0.7rem; color: var(--text); font-weight: 800;">SALIDA</span>
                                </div>
                                <div style="display: flex; gap: 7px;">
                                    <button class="btn btn-action-mini success" onclick="openBarrier('SALIDA', 'OPEN')" title="Abrir Barrera de Salida" style="padding: 6px 36px; font-size: 0.65rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
                                        <i class="fas fa-lock-open"></i> ABRIR
                                    </button>
                                    <button class="btn btn-action-mini danger" onclick="openBarrier('SALIDA', 'CLOSE')" title="Cerrar Barrera de Salida" style="padding: 6px 36px; font-size: 0.65rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;">
                                        <i class="fas fa-lock"></i> CERRAR
                                    </button>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</div>
