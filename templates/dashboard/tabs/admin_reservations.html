<!-- PESTAÑA: RESERVAS DE USUARIOS -->
<div id="tab-admin-reservations" class="tab-view" style="display: none;">
    <!-- KPIS DE RESERVAS -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));">
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-calendar-check"></i></div>
            <div class="kpi-data">
                <span class="label">Total Reservas</span>
                <span class="value" id="admin-res-stat-total">0</span>
            </div>
        </div>
        <div class="kpi-card highlight">
            <div class="kpi-icon"><i class="fas fa-clock"></i></div>
            <div class="kpi-data">
                <span class="label">Pendientes Hoy</span>
                <span class="value" id="admin-res-stat-pending">0</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-calendar-day"></i></div>
            <div class="kpi-data">
                <span class="label">Reservas Hoy</span>
                <span class="value" id="admin-res-stat-today">0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header-premium">
            <div class="header-info-group" style="display: flex; align-items: center; gap: 15px; flex: 1;">
                <div class="header-icon"><i class="fas fa-list-check"></i></div>
                <div class="header-text">
                    <h3>REGISTRO DE RESERVAS</h3>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn--premium sm" onclick="openNewReservationModal()" title="Crear una reserva manual y registrar el pago">
                    <i class="fas fa-plus"></i> <span class="nav-text">NUEVA RESERVA</span>
                </button>
                <div class="filter-group-premium" title="Filtrar por estado de la reserva">
                    <i class="fas fa-filter"></i>
                    <select id="admin-res-filter-status" class="select-premium-sm" onchange="loadAdminReservations()">
                        <option value="">Todos los Estados</option>
                        <option value="Pendiente">Pendientes</option>
                        <option value="Activa">Activas</option>
                        <option value="Completada">Completadas</option>
                        <option value="Cancelada">Canceladas</option>
                    </select>
                </div>
                <div class="search-box-premium" title="Buscar por patente, nombre o apellido">
                    <i class="fas fa-search"></i>
                    <input type="text" id="admin-res-search" placeholder="Buscar patente..." onkeyup="filterTable('admin-res-list', this.value)">
                </div>
            </div>

        </div>
        <div class="table-container">
            <table class="table-centered">
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Vehículo</th>
                        <th>Período</th>
                        <th>Tipo</th>
                        <th>Monto</th>
                        <th>Estado Pago</th>
                        <th>Estado Reserva</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="admin-res-list">
                    <tr class="skeleton-loading" aria-hidden="true"><td colspan="8"><div class="skeleton-cells"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></td></tr>
                    <tr class="skeleton-loading" aria-hidden="true"><td colspan="8"><div class="skeleton-cells"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></td></tr>
                    <tr class="skeleton-loading" aria-hidden="true"><td colspan="8"><div class="skeleton-cells"><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


<!-- MODAL: NUEVA RESERVA MANUAL -->
<div id="modal-new-reservation" class="modal">
    <div class="modal-content" style="max-width: 700px; padding: 0; background: transparent; border: none;">
        <div class="modern-reservation-card">
            <div class="card-header-premium">
                <div class="header-icon" style="color: var(--dorado);"><i class="fas fa-calendar-plus"></i></div>
                <div class="header-text">
                    <h3 class="text-dorado" style="margin: 0;" id="new-res-modal-title">NUEVA RESERVA MANUAL</h3>
                    <p style="margin: 5px 0 0 0;" id="new-res-modal-subtitle">Reserva y pago en la sucursal asignada</p>
                </div>
                <button class="modal-close-top modal-close-top--inline" onclick="closeModal('modal-new-reservation')">&times;</button>
            </div>

            <div style="padding: 30px;">
                <form id="form-new-reservation" onsubmit="handleAdminNewReservation(event)">
                    <div class="form-grid-premium">
                        <!-- SUCURSAL (valor interno, no editable) -->
                        <input type="hidden" id="new-res-sucursal">
                        <div class="form-group-premium">
                            <label>Patente</label>
                            <input type="text" id="new-res-patente" class="input-premium uppercase" placeholder="ABC 123" required maxlength="10" autocomplete="off" style="height: 43px;">
                            <div id="new-res-patente-owner-badge" style="display: none; align-items: center; gap: 7px; margin-top: 6px; font-size: 0.74rem; font-weight: 600; cursor: pointer; line-height: 1.3;" onclick="clearNewResPatenteLookup()" title="Hacer clic para desvincular">
                                <i class="fas fa-user-check"></i>
                                <span></span>
                                <i class="fas fa-times" style="opacity: 0.6; font-size: 0.65rem;"></i>
                            </div>
                        </div>
                        <div class="form-group-premium">
                            <label>Tipo de Vehículo</label>
                            <div class="select-wrapper-premium">
                                <i id="new-res-veh-icon" class="fas fa-car-side"></i>
                                <select id="new-res-tipo-vehiculo" required onchange="updateNewVehicleTypeIcon(this.value)">
                                    <option value="Auto">AUTO</option>
                                    <option value="Moto">MOTO</option>
                                    <option value="Camioneta">CAMIONETA</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group-premium">
                            <label>Tipo de Estadía</label>
                            <div style="display: flex; gap: 12px; align-items: stretch;">
                                <div class="select-wrapper-premium" style="flex: 1 1 auto; min-width: 0;">
                                    <i class="fas fa-clock"></i>
                                    <select id="new-res-tipo" required onchange="updateNewFormGroups(this.value)">
                                        <option value="hora">HORA</option>
                                        <option value="dia">DÍA</option>
                                        <option value="semana">SEMANAL</option>
                                        <option value="quincena">QUINCENAL</option>
                                        <option value="mes">MENSUAL</option>
                                    </select>
                                </div>
                                <div id="new-res-date-only-group" style="display:none; flex: 0 1 150px; min-width: 120px;">
                                    <input type="text" id="new-res-date-only" class="input-premium flatpickr-input" placeholder="Día..." style="text-align: center;">
                                </div>
                            </div>
                        </div>

                        <!-- CAMPOS DINÁMICOS -->
                        <div id="new-dynamic-fields" class="full-width-premium">
                            <!-- Hourly -->
                            <div id="new-hourly-fields" class="dynamic-row-premium" data-display="flex" style="display:none; gap: 20px; justify-content: flex-start;">
                                <input type="hidden" id="new-res-time-only">
                                <input type="hidden" id="new-res-hours-qty" value="1">
                            </div>

                            <!-- Daily -->
                            <div id="new-daily-fields" class="dynamic-row-premium" style="display:none; gap: 20px; justify-content: flex-start;">
                                <div class="form-group-premium">
                                    <label>Día de Estadía</label>
                                    <input type="text" id="new-res-day-only" class="input-premium flatpickr-input" placeholder="Seleccioná día..." >
                                </div>
                            </div>

                            <!-- Weekly -->
                            <div id="new-weekly-fields" class="dynamic-row-premium dynamic-row-premium--period">
                                <div class="form-group-premium">
                                    <label>Inicia el día</label>
                                    <input type="text" id="new-res-week-start" class="input-premium flatpickr-input" placeholder="Fecha inicio..." >
                                </div>
                                <div class="form-group-premium">
                                    <label>Finaliza</label>
                                    <input type="text" id="new-res-week-end" class="input-premium-readonly" readonly >
                                </div>
                            </div>

                            <!-- Fortnight -->
                            <div id="new-fortnight-fields" class="dynamic-row-premium dynamic-row-premium--period">
                                <div class="form-group-premium">
                                    <label>Inicia el día</label>
                                    <input type="text" id="new-res-fortnight-start" class="input-premium flatpickr-input" placeholder="Fecha inicio..." >
                                </div>
                                <div class="form-group-premium">
                                    <label>Finaliza</label>
                                    <input type="text" id="new-res-fortnight-end" class="input-premium-readonly" readonly >
                                </div>
                            </div>

                            <!-- Month -->
                            <div id="new-month-fields" class="dynamic-row-premium dynamic-row-premium--period">
                                <div class="form-group-premium">
                                    <label>Inicia el día</label>
                                    <input type="text" id="new-res-month-start" class="input-premium flatpickr-input" placeholder="Fecha inicio..." >
                                </div>
                                <div class="form-group-premium">
                                    <label>Finaliza</label>
                                    <input type="text" id="new-res-month-end" class="input-premium-readonly" readonly >
                                </div>
                            </div>

                            <!-- Standard -->
                            <div id="new-standard-fields" class="dynamic-row-premium dynamic-row-premium--period">
                                <div class="form-group-premium">
                                    <label>Inicio</label>
                                    <input type="datetime-local" id="new-res-inicio" class="input-premium input-premium--plain">
                                </div>
                                <div class="form-group-premium">
                                    <label>Fin</label>
                                    <input type="datetime-local" id="new-res-fin" class="input-premium input-premium--plain">
                                </div>
                            </div>
                        </div>

                        <!-- DISPONIBILIDAD HORARIA -->
                        <div id="new-availability-status-container" class="full-width-premium" style="width: 100%; margin-top: -5px; display: none; flex-direction: column; align-items: center; gap: 10px;">
                            <div id="new-availability-badge" class="availability-badge-premium" style="display: none; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;"></div>
                            <div id="new-hourly-slots-grid" class="hourly-slots-grid-premium" style="display: none; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 520px; width: 100%;"></div>
                        </div>

                        <!-- MÉTODO DE PAGO + TOTAL -->
                        <div id="new-res-metodo-total-row" class="full-width-premium" style="display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;">
                            <div class="form-group-premium" id="new-res-metodo-pago-group" style="align-items: flex-start; flex: 1 1 auto; min-width: 220px;">
                                <label>Método de Pago</label>
                                <div class="select-wrapper-premium" style="max-width: 380px;">
                                    <i class="fas fa-money-bill-transfer"></i>
                                    <select id="new-res-metodo-pago" required style="text-align-last: left;">
                                        <option value="Efectivo">EFECTIVO</option>
                                        <option value="Mercado Pago">MERCADO PAGO</option>
                                        <option value="Transferencia">TRANSFERENCIA</option>
                                        <option value="Tarjeta">TARJETA</option>
                                        <option value="Otro">OTRO</option>
                                    </select>
                                </div>
                            </div>
                            <div class="price-summary-premium" style="align-items: center; text-align: center;">
                                <div id="new-res-discount-line" style="display: none; flex-direction: row; align-items: center; gap: 8px; margin-bottom: 2px; font-size: 0.85rem;"></div>
                                <span class="total-label">TOTAL A PAGAR</span>
                                <span class="total-amount" id="new-res-monto-total">$ ---</span>
                            </div>
                        </div>
                    </div>

                    <div class="reservation-footer-premium" style="justify-content: flex-end;">
                        <div class="flex-row gap-15">
                            <button type="button" class="btn btn--outline" onclick="closeModal('modal-new-reservation')" style="border-radius: 12px; padding: 12px 25px;">DESCARTAR</button>
                            <button type="submit" class="btn-confirm-premium" id="new-res-submit-btn">
                                <span>CREAR Y PAGAR</span>
                                <i class="fas fa-check"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE CONFIRMACIÓN DE EDICIÓN DE RESERVA (DIFERENCIA FINANCIERA) -->
<div id="modal-edit-resumo" class="modal">
    <div class="modal-content" style="max-width: 500px; padding: 30px;">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
            <div style="width: 46px; height: 46px; border-radius: 12px; background: rgba(212,175,55,0.15); color: var(--dorado); display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0;">
                <i class="fas fa-file-invoice-dollar"></i>
            </div>
            <div style="text-align: left;">
                <h3 style="margin: 0; font-size: 1.15rem; letter-spacing: 0.5px;">CONFIRMAR EDICIÓN</h3>
                <p style="margin: 3px 0 0 0; font-size: 0.78rem; color: #aaa;">Revisá los datos antes de guardar los cambios</p>
            </div>
            <button class="modal-close-top modal-close-top--inline" onclick="cancelEditResumo()" style="flex-shrink: 0;">&times;</button>
        </div>
        <div style="padding: 18px 0 0 0;">
            <div id="edit-confirm-resumo" style="display: flex; flex-direction: column; gap: 9px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 14px 16px; font-size: 0.83rem;"></div>
            <div id="edit-confirm-diff" style="margin: 14px 0 4px 0; font-weight: 700; font-size: 0.95rem; text-align: center;"></div>

            <div id="edit-confirm-method-group" class="form-group-premium full-width-premium" style="margin-top: 12px;">
                <label>Método</label>
                <div class="select-wrapper-premium" style="max-width: 100%;">
                    <i class="fas fa-money-bill-transfer"></i>
                    <select id="edit-confirm-metodo" style="text-align-last: left;">
                        <option value="Efectivo">EFECTIVO</option>
                        <option value="Mercado Pago">MERCADO PAGO</option>
                        <option value="Transferencia">TRANSFERENCIA</option>
                        <option value="Tarjeta">TARJETA</option>
                        <option value="Caja">CAJA</option>
                        <option value="Saldo">SALDO</option>
                        <option value="Otro">OTRO</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 22px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.07);">
                <button type="button" class="btn btn--outline" onclick="cancelEditResumo()" style="border-radius: 12px; padding: 12px 25px;">CANCELAR</button>
                <button type="button" class="btn-confirm-premium" onclick="confirmEditResumoProceed()" style="min-width: 200px;">
                    <span>CONFIRMAR EDICIÓN</span>
                    <i class="fas fa-check"></i>
                </button>
            </div>
        </div>
    </div>
</div>
