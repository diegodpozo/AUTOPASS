<section id="tab-promotions" class="tab-view" style="display: none;">
    <div class="content-wrapper">
        <div class="card glass-premium mx-auto" style="max-width: 800px; overflow: hidden;">
            <div class="card-header-premium">
                <div class="header-info-group justify-center" style="flex: 1; margin-left: 140px;">
                    <div class="header-icon"><i class="fas fa-gift"></i></div>
                    <div class="header-text">
                        <h3 style="color: var(--dorado);">PROMOCIONES</h3>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary btn-sm" onclick="showCreatePromotionModal()">
                        <i class="fas fa-plus"></i> NUEVA
                    </button>
                </div>
            </div>

            <div class="table-container" style="padding: 0 10px 20px 10px;">
                <table class="table-premium">
                    <thead>
                        <tr>
                            <th>Beneficio</th>
                            <th>Puntos</th>
                            <th>Sucursal</th>
                            <th class="hidden-mobile">Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="promotions-admin-table-body">
                        <!-- Cargado dinámicamente -->
                        <tr>
                            <td colspan="4" class="text-center p-20">Cargando promociones...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- MODAL: CREAR PROMOCIÓN -->
<div id="modal-create-promotion" class="modal" style="display: none;">
    <div class="modal-content glass-premium" style="max-width: 500px;">
        <div class="modal-header">
            <div class="flex-row items-center gap-10">
                <div class="header-icon-box sm">
                    <i class="fas fa-gift"></i>
                </div>
                <h3 style="color: var(--dorado);">NUEVA PROMOCIÓN</h3>
            </div>
            <span class="close-btn" onclick="closeModal('modal-create-promotion')"><i class="fas fa-xmark"></i></span>
        </div>
        <div class="modal-body">
            <form id="form-create-promotion" onsubmit="event.preventDefault(); handleCreatePromotion();">
                <div class="form-row">
                    <div class="form-group">
                        <label>Título del Beneficio</label>
                        <div class="input-with-icon">
                            <i class="fas fa-tag"></i>
                            <input type="text" id="promo-titulo" placeholder="Ej: 1 Hora Gratis" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Puntos necesarios</label>
                        <div class="input-with-icon">
                            <i class="fas fa-star"></i>
                            <input type="number" id="promo-costo" placeholder="500" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Descripción del Beneficio</label>
                    <div class="input-with-icon">
                        <i class="fas fa-align-left" style="top: 15px; transform: none;"></i>
                        <textarea id="promo-descripcion" rows="2" placeholder="Detalles del beneficio..." required style="padding-left: 45px;"></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>Seleccionar Ícono Visual</label>
                    <div class="icon-picker-grid" id="promo-icon-picker">
                        <div class="icon-option active" data-icon="fas fa-gift" onclick="selectPromoIcon(this)"><i class="fas fa-gift"></i></div>
                        <div class="icon-option" data-icon="fas fa-car" onclick="selectPromoIcon(this)"><i class="fas fa-car"></i></div>
                        <div class="icon-option" data-icon="fas fa-clock" onclick="selectPromoIcon(this)"><i class="fas fa-clock"></i></div>
                        <div class="icon-option" data-icon="fas fa-soap" onclick="selectPromoIcon(this)"><i class="fas fa-soap"></i></div>
                        <div class="icon-option" data-icon="fas fa-coffee" onclick="selectPromoIcon(this)"><i class="fas fa-coffee"></i></div>
                        <div class="icon-option" data-icon="fas fa-gas-pump" onclick="selectPromoIcon(this)"><i class="fas fa-gas-pump"></i></div>
                        <div class="icon-option" data-icon="fas fa-star" onclick="selectPromoIcon(this)"><i class="fas fa-star"></i></div>
                        <div class="icon-option" data-icon="fas fa-crown" onclick="selectPromoIcon(this)"><i class="fas fa-crown"></i></div>
                        <div class="icon-option" data-icon="fas fa-ticket" onclick="selectPromoIcon(this)"><i class="fas fa-ticket"></i></div>
                        <div class="icon-option" data-icon="fas fa-wrench" onclick="selectPromoIcon(this)"><i class="fas fa-wrench"></i></div>
                        <div class="icon-option" data-icon="fas fa-percent" onclick="selectPromoIcon(this)"><i class="fas fa-percent"></i></div>
                        <div class="icon-option" data-icon="fas fa-calendar-check" onclick="selectPromoIcon(this)"><i class="fas fa-calendar-check"></i></div>
                    </div>
                    <input type="hidden" id="promo-icono" value="fas fa-gift">
                </div>

                <div class="form-group admin-only-field">
                    <label>Sucursal Asignada</label>
                    <div class="input-with-icon">
                        <i class="fas fa-location-dot"></i>
                        <select id="promo-sucursal" class="select-premium" style="width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 15px 15px 15px 45px; border-radius: 12px; outline: none; -webkit-appearance: none; cursor: pointer;">
                            <option value="">Cargando sucursales...</option>
                        </select>
                        <i class="fas fa-chevron-down" style="position: absolute; right: 15px; left: auto; color: #666; font-size: 0.7rem; pointer-events: none;"></i>
                    </div>
                </div>
                
                <div class="flex-row justify-center mt-30 gap-20">
                    <button type="button" class="btn btn-outline" style="min-width: 140px;" onclick="closeModal('modal-create-promotion')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary" style="min-width: 140px;">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
