<!-- MODAL: AGREGAR PISO -->
<div id="modal-add-floor" class="modal">

        <div class="modal-header">
            <div class="flex-row items-center gap-10">

                </div>

            </div>
            <span class="close-btn" onclick="closeModal('modal-add-floor')">&times;</span>
        </div>
        <form id="form-add-floor" onsubmit="handleCreateFloor(event)" class="p-25">

            <div class="form-group-premium mb-20">

            </div>
            <div class="flex-row flex-wrap-mobile gap-15 modal-capacities-row">

                    <label>CAP. AUTOS</label>
                    <div class="input-with-icon">
                        <i class="fas fa-car"></i>
                        <input type="number" id="floor-cap-autos" class="input-premium" value="20" required>
                    </div>
                </div>
                <div class="form-group-premium flex-1">
                    <label>CAP. MOTOS</label>
                    <div class="input-with-icon">
                        <i class="fas fa-motorcycle"></i>
                        <input type="number" id="floor-cap-motos" class="input-premium" value="10" required>
                    </div>
                </div>
                <div class="form-group-premium flex-1">

                    <div class="input-with-icon">

    </div>
</div>

<!-- MODAL: AGREGAR/EDITAR CÁMARA -->
<div id="modal-camera-config" class="modal" style="display: none;">
    <div class="modal-content glass-premium" style="max-width: 500px;">
        <div class="modal-header">
            <div class="flex-row items-center gap-10">
                <div class="header-icon-box sm">
                    <i class="fas fa-video text-dorado"></i>
                </div>
                <h3 id="camera-modal-title" style="color: var(--dorado);">AGREGAR CÁMARA</h3>
            </div>
            <span class="close-btn" onclick="closeModal('modal-camera-config')"><i class="fas fa-xmark"></i></span>
        </div>
        <form id="form-camera-config" onsubmit="handleSaveCameraConfig(event)" class="p-25">
            <input type="hidden" id="edit-camera-id">
            
            <div class="form-group-premium mb-20">
                <label>NOMBRE DE LA CÁMARA</label>
                <div class="input-with-icon">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="camera-nombre" class="input-premium" placeholder="Ej: Entrada Sede Central, Patio de Camiones" required>
                </div>
            </div>

            <div class="form-group-premium mb-20">
                <label>CATEGORÍA / TIPO</label>
                <div class="input-with-icon">
                    <i class="fas fa-layer-group"></i>
                    <select id="camera-tipo" class="input-premium select-premium" style="background: #111424; color: #fff;" required>
                        <option value="PATENTE_INGRESO">LECTURA DE PATENTE - ENTRADA</option>
                        <option value="PATENTE_EGRESO">LECTURA DE PATENTE - SALIDA</option>
                        <option value="QR_INGRESO">LECTOR DE QR - ENTRADA</option>
                        <option value="QR_EGRESO">LECTOR DE QR - SALIDA</option>
                        <option value="PREDIO">VIGILANCIA</option>
                    </select>
                </div>
            </div>

            <div class="form-group-premium mb-20">
                <label>DIRECCIÓN IP / ORIGEN (VIDEO SOURCE)</label>
                <div class="input-with-icon">
                    <i class="fas fa-link"></i>
                    <input type="text" id="camera-source" class="input-premium" placeholder="Ej: http://192.168.1.50:8080/video o 0 para webcam" required style="font-family: var(--font-mono); font-size: 0.8rem;">
                </div>
            </div>

            <div class="form-group-premium mb-20" id="camera-sucursal-group" style="display: none;">
                <label>SUCURSAL / SEDE</label>
                <div class="input-with-icon">
                    <i class="fas fa-building"></i>
                    <select id="camera-sucursal" class="input-premium select-premium" style="background: #111424; color: #fff;">
                        <option value="">GLOBAL (Sin sucursal)</option>
                    </select>
                </div>
            </div>

            <div class="form-group-premium mb-20">
                <label class="flex-row items-center gap-10 cursor-pointer">
                    <input type="checkbox" id="camera-activa" checked style="width: 18px; height: 18px; accent-color: var(--dorado);">
                    <span style="font-size: 0.85rem; color: #fff;">Cámara Activa</span>
                </label>
            </div>

            <div class="flex-row justify-center mt-30 gap-15">
                <button type="button" class="btn btn-outline" onclick="closeModal('modal-camera-config')">CANCELAR</button>
                <button type="submit" id="btn-camera-submit" class="btn btn-primary">GUARDAR CÁMARA</button>
            </div>
        </form>
    </div>
</div>
