<!-- MODAL: AGREGAR/EDITAR CÁMARA -->
<div id="modal-camera-config" class="modal">
    <div class="modal-content glass-premium">
        <div class="modal-header">
            <div class="flex-row items-center gap-10">
                <div class="header-icon-box sm">
                    <i class="fas fa-video text-dorado"></i>
                </div>
                <h3 id="camera-modal-title" class="text-dorado">AGREGAR CÁMARA</h3>
            </div>
            <span class="close-btn" onclick="closeModal('modal-camera-config')"><i class="fas fa-xmark"></i></span>
        </div>
        <form id="form-camera-config" onsubmit="handleSaveCameraConfig(event)" class="p-25">
            <input type="hidden" id="edit-camera-id">
            
            <div class="form-group-premium mb-20">
                <label>NOMBRE DE LA CÁMARA</label>
                <div class="input-with-icon">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="camera-nombre" class="input-premium" placeholder="Ej: Entrada Sede Central, Patio de Camiones" required>
                </div>
            </div>

            <div class="form-group-premium mb-20">
                <label>CATEGORÍA / TIPO</label>
                <div class="input-with-icon">
                    <i class="fas fa-layer-group"></i>
                    <select id="camera-tipo" class="input-premium select-premium" required>
                        <option value="PATENTE_INGRESO">LECTURA DE PATENTE - ENTRADA</option>
                        <option value="PATENTE_EGRESO">LECTURA DE PATENTE - SALIDA</option>
                        <option value="QR_INGRESO">LECTOR DE QR - ENTRADA</option>
                        <option value="QR_EGRESO">LECTOR DE QR - SALIDA</option>
                        <option value="PREDIO">VIGILANCIA</option>
                    </select>
                </div>
            </div>

            <div class="form-group-premium mb-20">
                <label>DIRECCIÓN IP / ORIGEN (VIDEO SOURCE)</label>
                <div class="input-with-icon">
                    <i class="fas fa-link"></i>
                    <input type="text" id="camera-source" class="input-premium" placeholder="Ej: http://192.168.1.50:8080/video o 0 para webcam" required>
                </div>
            </div>

            <div class="form-group-premium mb-20" id="camera-sucursal-group">
                <label>SUCURSAL / SEDE</label>
                <div class="input-with-icon">
                    <i class="fas fa-building"></i>
                    <select id="camera-sucursal" class="input-premium select-premium">
                        <option value="">GLOBAL (Sin sucursal)</option>
                    </select>
                </div>
            </div>

            <div class="form-group-premium mb-20">
                <label class="flex-row items-center gap-10 cursor-pointer">
                    <input type="checkbox" id="camera-activa" checked>
                    <span class="camera-active-label">Cámara Activa</span>
                </label>
            </div>

            <div class="flex-row justify-center mt-30 gap-15">
                <button type="button" class="btn btn--outline" onclick="closeModal('modal-camera-config')">CANCELAR</button>
                <button type="submit" id="btn-camera-submit" class="btn btn--primary">GUARDAR CÁMARA</button>
            </div>
        </form>
    </div>
</div>
