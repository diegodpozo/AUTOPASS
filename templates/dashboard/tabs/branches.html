<section id="tab-branches" class="tab-view" style="display: none;">
    <div class="content-wrapper">
        <div class="card glass-premium mx-auto" style="max-width: 1000px; overflow: hidden;">
            <div class="card-header-premium">
                <div class="header-info-group justify-center" style="flex: 1; margin-left: 140px;">
                    <div class="header-icon"><i class="fas fa-building-shield"></i></div>
                    <div class="header-text">
                        <h3 style="color: var(--dorado);">SUCURSALES</h3>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary btn-sm admin-only" onclick="showCreateBranchModal()">
                        <i class="fas fa-plus"></i> NUEVA
                    </button>
                </div>
            </div>

            <div class="table-container" style="padding: 0 10px 20px 10px;">
                <table class="table-premium">
                    <thead>
                        <tr>
                            <th>Sucursal</th>
                            <th>Dirección</th>
                            <th>Administrador</th>
                            <th class="hidden-mobile">Teléfono</th>
                            <th>Horario</th>
                            <th>Estado</th>
                            <th class="admin-only">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="branches-table-body">
                        <!-- Dinámico JS -->
                        <tr>
                            <td colspan="7" class="text-center p-20">Cargando red de sucursales...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- MODAL: AGREGAR SUCURSAL -->
<div id="modal-add-branch" class="modal" style="display: none;">
    <div class="modal-content glass-premium" style="max-width: 500px;">
        <div class="modal-header">
            <div class="flex-row items-center gap-10">
                <div class="header-icon-box sm">
                    <i class="fas fa-building" id="branch-modal-icon"></i>
                </div>
                <h3 style="color: var(--dorado);" id="branch-modal-title">NUEVA SUCURSAL</h3>
            </div>
            <span class="close-btn" onclick="closeModal('modal-add-branch')"><i class="fas fa-xmark"></i></span>
        </div>
        <div class="modal-body">
            <form id="form-add-branch">
                <input type="hidden" id="branch-id-edit">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <div class="input-with-icon">
                            <i class="fas fa-tag"></i>
                            <input type="text" id="branch-nombre" placeholder="Ej: Central" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <div class="input-with-icon">
                            <i class="fas fa-phone"></i>
                            <input type="text" id="branch-telefono" placeholder="0800-444-AUTO" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Dirección</label>
                    <div class="flex-row gap-10">
                        <div class="input-with-icon" style="flex: 1;">
                            <i class="fas fa-map-location-dot"></i>
                            <input type="text" id="branch-direccion" placeholder="Ej: Av. del Libertador 1200, CABA" required>
                        </div>
                        <button type="button" class="btn btn-secondary sm" onclick="searchAddress()" style="min-width: 100px;">
                            <i class="fas fa-search-location"></i> BUSCAR
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Latitud</label>
                        <div class="input-with-icon">
                            <i class="fas fa-location-crosshairs"></i>
                            <input type="number" step="any" id="branch-latitude" placeholder="-34.65..." required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Longitud</label>
                        <div class="input-with-icon">
                            <i class="fas fa-location-crosshairs"></i>
                            <input type="number" step="any" id="branch-longitude" placeholder="-58.62..." required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Posicioná la sucursal en el mapa</label>
                    <div id="branch-map-picker" style="height: 180px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-top: 5px;"></div>
                    <p class="text-xs text-muted mt-5"><i class="fas fa-info-circle"></i> Hace click en el mapa para marcar la ubicación exacta.</p>
                </div>

                <div class="form-group">
                    <label>Logo de la Sucursal</label>
                    <div class="flex-row gap-20 items-center mt-10">
                        <div id="branch-logo-preview" style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: rgba(255,255,255,0.03); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.05);">
                            <img src="/static/images/logo.png" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.8;">
                        </div>
                        <div class="flex-col flex-1">
                            <label for="branch-logo-file" class="btn btn-outline sm" style="width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; border-style: dashed; background: rgba(255,255,255,0.02);">
                                <i class="fas fa-cloud-arrow-up"></i> SELECCIONAR LOGO
                            </label>
                            <input type="file" id="branch-logo-file" accept="image/*" style="display: none;" onchange="previewBranchLogo(this)">
                            <p class="text-xs text-muted mt-5">Subí el logo desde tu PC (.png, .jpg, .webp)</p>
                        </div>
                    </div>
                </div>
                
                <div class="form-group p-15" style="background: rgba(197, 160, 89, 0.03); border: 1px solid rgba(197, 160, 89, 0.1); border-radius: 12px;">
                    <label class="mb-15">Seleccionar Horario</label>
                    <div class="flex-row items-center gap-15">
                        <div id="horario-input-container" style="flex: 1;">
                            <div class="input-with-icon">
                                <i class="fas fa-clock"></i>
                                <input type="text" id="branch-horario" placeholder="07:00 a 23:00" style="padding-left: 40px; font-size: 0.85rem;">
                            </div>
                        </div>
                        <div class="flex-row items-center gap-10" style="background: rgba(0,0,0,0.3); padding: 10px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); min-width: 110px; justify-content: center;">
                            <span class="text-xs font-bold" style="color: var(--dorado);">24 HS</span>
                            <label class="switch-premium">
                                <input type="checkbox" id="branch-is-24h" onchange="toggleBranchHorario(this)">
                                <span class="slider-premium"></span>
                            </label>
                        </div>
                    </div>
                    <p class="text-xs text-muted mt-8">Si seleccionás 24hs, el rango se anula automáticamente.</p>
                </div>

                <div class="flex-row justify-center mt-30 gap-20">
                    <button type="button" class="btn btn-outline" style="min-width: 140px;" onclick="closeModal('modal-add-branch')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary" style="min-width: 140px;">
                        <i class="fas fa-save"></i> GUARDAR
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
