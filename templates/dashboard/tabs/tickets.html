<div id="tab-tickets" class="tab-view" style="display: none;">
    <!-- KPIS DE TICKETS DE SOPORTE -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
        <div class="kpi-card highlight">
            <div class="kpi-icon"><i class="fas fa-inbox"></i></div>
            <div class="kpi-data">
                <span class="label">Total Tickets</span>
                <span class="value" id="stat-tickets-total">0</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-hourglass-half"></i></div>
            <div class="kpi-data">
                <span class="label">Pendientes</span>
                <span class="value" id="stat-tickets-pending">0</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-spinner"></i></div>
            <div class="kpi-data">
                <span class="label">En Proceso</span>
                <span class="value" id="stat-tickets-process">0</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-check-circle"></i></div>
            <div class="kpi-data">
                <span class="label">Resueltos</span>
                <span class="value" id="stat-tickets-resolved">0</span>
            </div>
        </div>
    </div>

    <!-- TARJETA PRINCIPAL Y TABLA DE TICKETS -->
    <div class="card">
        <div class="card-header-premium">
            <div class="header-info-group">
                <div class="header-icon"><i class="fas fa-headset"></i></div>
                <div class="header-text">
                    <h3>GESTIÓN DE TICKETS DE SOPORTE</h3>
                </div>
            </div>
            <div class="header-actions">
                <div class="filter-group-premium" title="Filtrar por estado del ticket">
                    <i class="fas fa-filter"></i>
                    <select id="ticket-admin-status-filter" class="select-premium-sm" onchange="loadAdminTickets()">
                        <option value="TODOS">Todos</option>
                        <option value="PENDIENTE">Pendientes</option>
                        <option value="EN PROCESO">En Proceso</option>
                        <option value="RESUELTO">Resueltos</option>
                    </select>
                </div>
                <div class="search-box-premium" title="Buscar por asunto, cliente o categoría">
                    <i class="fas fa-search"></i>
                    <input type="text" id="ticket-admin-search" placeholder="Buscar ticket..." onkeyup="filterTicketList(this.value)">
                </div>
            </div>
        </div>

        <div class="table-container">
            <table class="table-centered">
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Cliente</th>
                        <th>Categoría</th>
                        <th>Asunto</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tickets-admin-table-body">
                    <tr>
                        <td colspan="7" class="text-center p-30 text-muted">
                            <i class="fas fa-spinner fa-spin"></i> Cargando tickets...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL: ATENDER / RESPONDER TICKET -->
<div id="modal-ticket-answer" class="modal" style="display: none;">
    <div class="modal-content modal-content-large glass-premium" style="padding: 0; overflow: hidden;">
        <div class="modal-header card-header-premium" style="padding: 16px 25px;">
            <div class="header-info-group">
                <div class="header-icon"><i class="fas fa-headset"></i></div>
                <div class="header-text">
                    <h3 id="ticket-modal-title">ATENDER TICKET</h3>
                    <p id="ticket-modal-nro" style="margin: 4px 0 0;">---</p>
                </div>
            </div>
            <div class="header-actions">
                <span class="close-btn" onclick="closeModal('modal-ticket-answer')"><i class="fas fa-xmark"></i></span>
            </div>
        </div>
        <div class="modal-body" style="padding: 14px 22px 16px;">
            <input type="hidden" id="ticket-modal-id">

            <div class="info-grid-compact mb-5">
                <div class="info-item">
                    <i class="fas fa-user"></i>
                    <div>
                        <label>CLIENTE</label>
                        <span id="ticket-modal-client" class="text-bold">---</span>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <label>EMAIL</label>
                        <span id="ticket-modal-email" class="ticket-email-text">---</span>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-tag"></i>
                    <div>
                        <label>CATEGORÍA</label>
                        <span id="ticket-modal-category" class="text-bold">---</span>
                    </div>
                </div>
            </div>

            <div class="info-item mb-5" style="padding-top: 0;">
                <i class="fas fa-heading"></i>
                <div>
                    <label>ASUNTO</label>
                    <span id="ticket-modal-subject" class="text-bold" style="white-space: normal;">---</span>
                </div>
            </div>

            <div id="ticket-admin-messages" class="ticket-chat"></div>

            <form onsubmit="submitTicketAnswer(event)">
                <div id="ticket-answer-locked" class="ticket-answer-locked" style="display: none;">
                    <i class="fas fa-lock"></i> Ticket resuelto y bloqueado. Solo visualización.
                </div>
                <div class="form-group mb-10">
                    <label for="ticket-answer-text" class="text-muted text-small text-bold block mb-5">RESPUESTA</label>
                    <textarea id="ticket-answer-text" class="textarea-premium" rows="3" placeholder="Escribí aquí la respuesta o resolución enviada al cliente..."></textarea>
                </div>

                <div class="flex-row items-end justify-between gap-10">
                    <div class="form-group" style="max-width: 150px; flex-shrink: 0;">
                        <label for="ticket-answer-status" class="text-muted text-small text-bold block mb-5">ESTADO</label>
                        <div class="select-premium-box">
                            <select id="ticket-answer-status" class="select-premium" required>
                                <option value="En Proceso">En Proceso</option>
                                <option value="Resuelto">Resuelto</option>
                                <option value="Pendiente">Pendiente</option>
                            </select>
                            <i class="fas fa-chevron-down select-premium-chevron"></i>
                        </div>
                    </div>

                    <div class="flex-row items-end gap-10 modal-footer-buttons" style="flex-shrink: 0; padding-bottom: 12px;">
                        <button type="button" class="btn btn-outline" onclick="closeModal('modal-ticket-answer')">CANCELAR</button>
                        <button type="submit" id="btn-save-ticket-answer" class="btn btn-primary">ENVIAR</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
