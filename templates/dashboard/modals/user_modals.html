<!-- MODAL: CREAR USUARIO ADMIN/STAFF -->
<div id="modal-create-user" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('modal-create-user')"><i class="fas fa-xmark"></i></span>
        <h2 class="text-dorado">ALTA USUARIO</h2>
        
        <form onsubmit="handleAdminCreateUser(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="admin-user-nombre" placeholder="Nombre/s" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-tag"></i>
                        <input type="text" id="admin-user-apellido" placeholder="Apellido" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="admin-user-email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>DNI</label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="admin-user-dni" class="digits-only" placeholder="12345678" maxlength="8" required>
                    </div>
                    <small class="field-hint">Solo números, sin puntos.</small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Rol</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-shield"></i>
                        <select id="admin-user-rol" class="select-premium" onchange="toggleBranchSelection()">
                            <option value="user">Cliente</option>
                            <option value="staff">Empleado</option>
                            <option value="local_admin">Administrador de Sucursal</option>
                            <option value="admin">Administrador General</option>
                        </select>
                        <i class="fas fa-chevron-down select-caret"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraseña Temporal</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="admin-user-password" placeholder="Clave temporal" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('admin-user-password', this)"></i>
                    </div>
                </div>
            </div>

            <!-- SELECCIÓN DE SUCURSAL (Solo para Staff o Admin Local) -->
            <div id="branch-selection-row" class="form-row">
                <div class="form-group">
                    <label>Sucursal Asignada</label>
                    <div class="input-with-icon">
                        <i class="fas fa-location-dot"></i>
                        <select id="admin-user-sucursal" class="select-premium">
                        </select>
                        <i class="fas fa-chevron-down select-caret"></i>
                    </div>
                </div>
            </div>

            <div class="form-row form-row-tight">
                <div class="form-group"></div>
                <div class="form-group">
                    <small class="modal-hint">
                        Min. 8 caracteres, 1 mayúscula y 1 símbolo.
                    </small>
                </div>
            </div>

            <div class="flex-row justify-center mt-20 gap-20">
                <button type="button" class="btn btn--outline btn-modal-action" onclick="closeModal('modal-create-user')">CANCELAR</button>
                <button type="submit" class="btn btn--primary btn-modal-action"><i class="fas fa-user-plus"></i> CREAR USUARIO</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL: EDITAR USUARIO -->
<div id="modal-edit-user" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('modal-edit-user')"><i class="fas fa-xmark"></i></span>
        <h2 class="text-dorado">EDITAR USUARIO</h2>
        
        <form onsubmit="handleAdminEditUser(event)">
            <input type="hidden" id="edit-user-id">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="edit-user-nombre" placeholder="Nombre/s" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-tag"></i>
                        <input type="text" id="edit-user-apellido" placeholder="Apellido" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="edit-user-email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>DNI</label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="edit-user-dni" class="digits-only" placeholder="12345678" maxlength="8" required>
                    </div>
                    <small class="field-hint">Solo números, sin puntos.</small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Teléfono</label>
                    <div class="input-with-icon">
                        <i class="fas fa-phone"></i>
                        <input type="text" id="edit-user-tel" class="digits-only" placeholder="1122334455" maxlength="13" required>
                    </div>
                    <small class="field-hint">Solo números, máximo 13 dígitos.</small>
                </div>
                <div class="form-group">
                    <label>Rol</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-shield"></i>
                        <select id="edit-user-rol" class="select-premium" onchange="toggleEditBranchSelection()">
                            <option value="user">Cliente</option>
                            <option value="staff">Empleado</option>
                            <option value="local_admin">Administrador de Sucursal</option>
                            <option value="admin">Administrador General</option>
                        </select>
                        <i class="fas fa-chevron-down select-caret"></i>
                    </div>
                </div>
            </div>

            <!-- SELECCIÓN DE SUCURSAL (Solo para Staff o Admin Local) -->
            <div id="edit-branch-selection-row" class="form-row">
                <div class="form-group">
                    <label>Sucursal Asignada</label>
                    <div class="input-with-icon">
                        <i class="fas fa-location-dot"></i>
                        <select id="edit-user-sucursal" class="select-premium">
                        </select>
                        <i class="fas fa-chevron-down select-caret"></i>
                    </div>
                </div>
            </div>

            <div class="flex-row justify-center mt-20 gap-20">
                <button type="button" class="btn btn--outline btn-modal-action" onclick="closeModal('modal-edit-user')">CANCELAR</button>
                <button type="submit" class="btn btn--primary btn-modal-action"><i class="fas fa-save"></i> GUARDAR CAMBIOS</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL: CAMBIAR CONTRASEÑA (ADMIN) -->
<div id="modal-change-password-admin" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('modal-change-password-admin')"><i class="fas fa-xmark"></i></span>
        <h2 class="text-dorado">CAMBIAR CONTRASEÑA</h2>
        <p class="text-small text-muted mb-20">Cambiar clave para: <b id="admin-pass-username" class="text-white">---</b></p>
        
        <form onsubmit="handleAdminChangePassword(event)">
            <input type="hidden" id="admin-pass-userid">
            
            <div class="form-group">
                <label>Nueva Contraseña</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="admin-new-password" placeholder="Mín. 8 caracteres" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('admin-new-password', this)"></i>
                </div>
                <small class="modal-hint">
                    Debe incluir Mayúscula y Símbolo.
                </small>
            </div>

            <div class="flex-row justify-center mt-20 gap-20">
                <button type="button" class="btn btn--outline" onclick="closeModal('modal-change-password-admin')">CANCELAR</button>
                <button type="submit" class="btn btn--primary">GUARDAR</button>
            </div>
        </form>
    </div>
</div>
