<!-- MODAL: VER NIVELES DE SUCURSAL -->
<div id="modal-branch-floors" class="modal" style="display: none;">
    <div class="modal-content glass-premium" style="max-width: 700px;">
        <div class="modal-header">
            <div class="flex-row items-center gap-10">
                <div class="header-icon-box sm">
                    <i class="fas fa-layer-group"></i>
                </div>
                <h3 style="color: var(--dorado);" id="branch-floors-title">NIVELES: SUCURSAL</h3>
            </div>
            <span class="close-btn" onclick="closeModal('modal-branch-floors')"><i class="fas fa-xmark"></i></span>
        </div>
        <div class="modal-body" style="padding: 20px;">
            <div class="table-container">
                <table class="table-premium">
                    <thead>
                        <tr>
                            <th>Nivel / Nombre</th>
                            <th class="text-center">Autos (Ocup/Cap)</th>
                            <th class="text-center">Motos (Ocup/Cap)</th>
                            <th class="text-center">Camionetas (Ocup/Cap)</th>
                            <th class="text-center">Reservas (Ocup/Cap)</th>
                        </tr>
                    </thead>
                    <tbody id="branch-floors-body">
                        <!-- Dinámico JS -->
                    </tbody>
                </table>
            </div>
            <div class="flex-row justify-center mt-20">
                <button class="btn btn-outline" onclick="closeModal('modal-branch-floors')">CERRAR</button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: AGREGAR SUCURSAL -->
<div id="modal-add-branch" class="modal" style="display: none;">
    <div class="modal-content glass-premium" style="max-width: 850px;">
        <div class="modal-header">
            <div class="flex-row items-center gap-10">
                <div class="header-icon-box sm">
                    <i class="fas fa-building" id="branch-modal-icon"></i>
                </div>
                <h3 style="color: var(--dorado);" id="branch-modal-title">NUEVA SUCURSAL</h3>
            </div>
            <span class="close-btn" onclick="closeModal('modal-add-branch')"><i class="fas fa-xmark"></i></span>
        </div>
        <div class="modal-body" style="padding: 20px;">
            <form id="form-add-branch">
                <input type="hidden" id="branch-id-edit">
                <input type="hidden" id="branch-logo-clear" value="false">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                    <!-- COLUMNA IZQUIERDA: IDENTIDAD Y UBICACIÓN -->
                    <div class="flex-col gap-15">
                        <h4 class="text-dorado text-xs mb-5" style="letter-spacing: 1px;">DATOS PRINCIPALES</h4>
                        
                        <div class="form-group">
                            <label>Nombre de Sucursal</label>
                            <div class="input-with-icon">
                                <i class="fas fa-tag"></i>
                                <input type="text" id="branch-nombre" placeholder="Ej: Central" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Teléfono de Contacto</label>
                            <div class="input-with-icon">
                                <i class="fas fa-phone"></i>
                                <input type="text" id="branch-telefono" placeholder="0800-444-AUTO" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Dirección</label>
                            <div class="flex-row gap-10">
                                <div class="input-with-icon" style="flex: 1;">
                                    <i class="fas fa-map-location-dot"></i>
                                    <input type="text" id="branch-direccion" placeholder="Ej: Av. del Libertador 1200, CABA" required>
                                </div>
                                <button type="button" class="btn btn-secondary sm" onclick="searchAddress()" style="min-width: 80px; padding: 0 10px;">
                                    <i class="fas fa-search-location"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Campos ocultos de coordenadas -->
                        <input type="number" step="any" id="branch-latitude" style="display:none;" required>
                        <input type="number" step="any" id="branch-longitude" style="display:none;" required>

                        <div class="form-group">
                            <label>Mapa de Ubicación</label>
                            <div id="branch-map-picker" style="height: 350px; border-radius: 20px; border: 1.5px solid rgba(197, 160, 89, 0.2); box-shadow: inset 0 0 20px rgba(0,0,0,0.4);"></div>
                        </div>
                    </div>

                    <!-- COLUMNA DERECHA: LOGO Y HORARIOS -->
                    <div class="flex-col gap-15">
                        <div class="form-group">
                            <label>Logo de la Sucursal</label>
                            <div class="flex-row gap-15 items-center mt-5" style="background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                                <div style="position: relative;">
                                    <div id="branch-logo-preview" style="width: 65px; height: 65px; border-radius: 50%; overflow: hidden; background: #000; border: 1px solid var(--dorado);">
                                        <img src="/static/images/logo.png" style="width: 100%; height: 100%; object-fit: cover;">
                                    </div>
                                    <button type="button" id="btn-clear-logo" onclick="clearBranchLogo()" title="Eliminar logo" style="display: none; position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%; background: #ef4444; color: #fff; border: 2px solid #000; cursor: pointer; font-size: 0.65rem; line-height: 1; padding: 0; z-index: 5;"><i class="fas fa-xmark"></i></button>
                                </div>
                                <div class="flex-col flex-1">
                                    <label for="branch-logo-file" class="btn btn-outline sm" style="width: 100%; cursor: pointer; font-size: 0.7rem;">
                                        <i class="fas fa-upload"></i> SUBIR IMAGEN
                                    </label>
                                    <input type="file" id="branch-logo-file" accept="image/*" style="display: none;" onchange="previewBranchLogo(this)">
                                </div>
                            </div>
                        </div>

                        <div class="form-group p-15" style="background: rgba(197, 160, 89, 0.05); border: 1px solid rgba(197, 160, 89, 0.1); border-radius: 12px;">
                            <label class="mb-10">Horario Operativo</label>
                            <div class="flex-col gap-10">
                                <div id="horario-input-container">
                                    <div class="input-with-icon">
                                        <i class="fas fa-clock"></i>
                                        <input type="text" id="branch-horario" placeholder="07:00 a 23:00" style="padding-left: 40px; font-size: 0.85rem;">
                                    </div>
                                </div>
                                <div class="flex-row items-center justify-between" style="background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 10px;">
                                    <span class="text-xs font-bold" style="color: var(--dorado);">¿ABIERTO 24 HS?</span>
                                    <label class="switch-premium">
                                        <input type="checkbox" id="branch-is-24h" onchange="toggleBranchHorario(this)">
                                        <span class="slider-premium"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <p class="text-xs text-muted" style="line-height: 1.4;">
                            <i class="fas fa-info-circle text-dorado"></i> 
                            Asegurate de que la ubicación en el mapa sea exacta para los reportes de geolocalización.
                        </p>
                    </div>
                </div>

                <div class="flex-row justify-center mt-25 gap-20">
                    <button type="button" class="btn btn-outline" style="min-width: 120px;" onclick="closeModal('modal-add-branch')">CANCELAR</button>
                    <button type="submit" class="btn btn-primary" style="min-width: 160px;">
                        <i class="fas fa-save"></i> GUARDAR SUCURSAL
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
