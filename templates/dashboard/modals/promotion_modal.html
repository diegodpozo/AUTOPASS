{% from "components/modal_header.html" import modal_header %}
<!-- MODAL: CREAR PROMOCIÓN -->
<div id="modal-create-promotion" class="modal">
    <div class="modal-content modal-content--banded">
        {{ modal_header('fas fa-gift', 'NUEVA PROMOCIÓN', "closeModal('modal-create-promotion')", title_id='promo-modal-title') }}
        <div class="modal-body">
            <form id="form-create-promotion" onsubmit="event.preventDefault(); handleCreatePromotion();">
                <div class="form-row promo-form-layout">
                    <!-- COLUMNA 1: DATOS DEL BENEFICIO -->
                    <div class="flex-col gap-15">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Título del Beneficio</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-tag"></i>
                                    <input type="text" id="promo-titulo" placeholder="Ej: 1 Hora Gratis" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Puntos necesarios</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-star"></i>
                                    <input type="number" id="promo-costo" placeholder="500" required>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Descripción del Beneficio</label>
                            <div class="input-with-icon">
                                <i class="fas fa-align-left"></i>
                                <textarea id="promo-descripcion" rows="2" placeholder="Detalles del beneficio..." required></textarea>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Seleccionar Ícono Visual</label>
                            <div class="icon-picker-grid">
                                <div class="icon-option active" data-icon="fas fa-gift" onclick="selectPromoIcon(this)"><i class="fas fa-gift"></i></div>
                                <div class="icon-option" data-icon="fas fa-car" onclick="selectPromoIcon(this)"><i class="fas fa-car"></i></div>
                                <div class="icon-option" data-icon="fas fa-clock" onclick="selectPromoIcon(this)"><i class="fas fa-clock"></i></div>
                                <div class="icon-option" data-icon="fas fa-soap" onclick="selectPromoIcon(this)"><i class="fas fa-soap"></i></div>
                                <div class="icon-option" data-icon="fas fa-coffee" onclick="selectPromoIcon(this)"><i class="fas fa-coffee"></i></div>
                                <div class="icon-option" data-icon="fas fa-gas-pump" onclick="selectPromoIcon(this)"><i class="fas fa-gas-pump"></i></div>
                                <div class="icon-option" data-icon="fas fa-star" onclick="selectPromoIcon(this)"><i class="fas fa-star"></i></div>
                                <div class="icon-option" data-icon="fas fa-crown" onclick="selectPromoIcon(this)"><i class="fas fa-crown"></i></div>
                                <div class="icon-option" data-icon="fas fa-ticket" onclick="selectPromoIcon(this)"><i class="fas fa-ticket"></i></div>
                                <div class="icon-option" data-icon="fas fa-wrench" onclick="selectPromoIcon(this)"><i class="fas fa-wrench"></i></div>
                                <div class="icon-option" data-icon="fas fa-percent" onclick="selectPromoIcon(this)"><i class="fas fa-percent"></i></div>
                                <div class="icon-option" data-icon="fas fa-calendar-check" onclick="selectPromoIcon(this)"><i class="fas fa-calendar-check"></i></div>
                            </div>
                            <input type="hidden" id="promo-icono" value="fas fa-gift">
                        </div>

                        <div class="form-group">
                            <label>Tipo de Canje</label>
                            <div class="input-with-icon promo-tipo-select">
                                <i class="fas fa-tags"></i>
                                <select id="promo-tipo-canje" class="select-premium" onchange="togglePromoTipoCanje(this)">
                                    <option value="voucher">VOUCHER (ticket con QR)</option>
                                    <option value="descuento_reserva">DESCUENTO DE RESERVA (%)</option>
                                </select>
                                <i class="fas fa-chevron-down select-caret"></i>
                            </div>
                        </div>

                        <div class="form-group" id="promo-descuento-field">
                            <label>% de Descuento en Estacionamiento</label>
                            <div class="input-with-icon">
                                <i class="fas fa-percent"></i>
                                <input type="number" id="promo-valor-descuento" placeholder="Ej: 10" min="1" max="100">
                            </div>
                        </div>

                        <div class="form-group admin-only-field">
                            <label>Sucursal Asignada</label>
                            <div class="input-with-icon">
                                <i class="fas fa-location-dot"></i>
                                <select id="promo-sucursal" class="select-premium">
                                    <option value="">Cargando sucursales...</option>
                                </select>
                                <i class="fas fa-chevron-down select-caret"></i>
                            </div>
                        </div>
                    </div>

                    <!-- COLUMNA 2: UBICACIÓN Y MAPA -->
                    <div class="flex-col gap-15">
                        <div class="form-group">
                            <label>Dirección donde se canjea</label>
                            <div class="flex-row gap-10">
                                <div class="input-with-icon">
                                    <i class="fas fa-map-location-dot"></i>
                                    <input type="text" id="promo-direccion" placeholder="Ej: Av. del Libertador 1200, CABA">
                                </div>
                                <button type="button" class="btn btn--secondary sm" onclick="searchPromoAddress()">
                                    <i class="fas fa-search-location"></i> BUSCAR
                                </button>
                            </div>
                            <small class="promo-form-hint">Buscá la dirección o tocá el mapa para marcar el punto exacto de canje.</small>
                        </div>

                        <!-- Campos ocultos de coordenadas -->
                        <input type="number" step="any" id="promo-latitude">
                        <input type="number" step="any" id="promo-longitude">

                        <div class="form-group">
                            <label>Mapa de Ubicación</label>
                            <div id="promo-map-picker"></div>
                        </div>
                    </div>
                </div>

                <div class="flex-row justify-center gap-20 modal-actions-sticky">
                    <button type="button" class="btn btn--outline" onclick="closeModal('modal-create-promotion')">CANCELAR</button>
                    <button type="submit" class="btn btn--primary">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
