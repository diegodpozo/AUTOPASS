<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @media only screen and (max-width: 620px) {
            .container { width: 100% !important; border-radius: 0 !important; }
            .content { padding: 20px !important; }
        }
    </style>
</head>
<body style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #000; color: #fff; margin: 0; padding: 0;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #000;">
        <tr>
            <td align="center" style="padding: 20px 0;">
                <table class="container" border="0" cellpadding="0" cellspacing="0" width="600" style="background-color: #111; border: 1px solid #dfba6b; border-radius: 10px; overflow: hidden;">
                    <!-- HEADER -->
                    <tr>
                        <td align="center" style="background-color: #dfba6b; padding: 25px;">
                            <h1 style="color: #000; margin: 0; font-size: 28px; letter-spacing: 4px; font-weight: 900;">AUTOPASS</h1>
                        </td>
                    </tr>
                    <!-- CONTENT -->
                    <tr>
                        <td class="content" style="padding: 40px; line-height: 1.6;">
                            <h2 style="color: #dfba6b; margin-top: 0;">¡Listo, {{ user_name }}!</h2>
                            <p style="color: #ccc; font-size: 16px;">Tu registro en <strong>AUTOPASS</strong> quedó confirmado y tu contraseña ya está configurada.</p>
                            <p style="color: #ccc; font-size: 16px;">Ya podés ingresar al panel con tu correo y la clave que elegiste.</p>

                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="padding: 40px 0;">
                                        <a href="{{ login_url }}" style="background-color: #dfba6b; color: #000; padding: 18px 30px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 16px; display: inline-block; text-transform: uppercase;">Ingresar a AUTOPASS</a>
                                    </td>
                                </tr>
                            </table>

                            <p style="font-size: 14px; color: #888; text-align: center; margin-bottom: 0;">Si vos no configuraste esta cuenta, contactanos de inmediato.</p>
                        </td>
                    </tr>
                    <!-- FOOTER -->
                    <tr>
                        <td align="center" style="background-color: #000; padding: 25px; border-top: 1px solid #222;">
                            <p style="font-size: 12px; color: #444; margin: 0;">&copy; 2026 AutoPass Professional.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
