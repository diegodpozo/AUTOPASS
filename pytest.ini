[pytest]
testpaths = tests
pythonpath = .
# GRUPO "postgres": tests que necesitan una base Postgres real (red + advisory locks).
# Se DESELECCIONAN por defecto para que la suite normal sea rapida y funcione offline.
# Para correrlos:  venv\Scripts\python.exe -m pytest -m postgres
# (el -m de la linea de comandos pisa este addopts).
addopts = -m "not postgres"
markers =
    postgres: requiere una base Postgres real (R1/R2 del plan de concurrencia)
