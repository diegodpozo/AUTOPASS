<!-- PESTAÑA: GESTIÓN DE USUARIOS -->
<div id="tab-users" class="tab-view" style="display: none;">
    <!-- KPIS DE USUARIOS -->
    <div class="kpi-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
        <div class="kpi-card highlight">
            <div class="kpi-icon"><i class="fas fa-users"></i></div>
            <div class="kpi-data">
                <span class="label">Totales</span>
                <span class="value" id="stat-total-users">0</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-user-shield"></i></div>
            <div class="kpi-data">
                <span class="label">Administradores</span>
                <span class="value" id="stat-admin-users">0</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-user-gear"></i></div>
            <div class="kpi-data">
                <span class="label">Empleados</span>
                <span class="value" id="stat-staff-users">0</span>
            </div>
        </div>
        <div class="kpi-card">
            <div class="kpi-icon"><i class="fas fa-user-graduate"></i></div>
            <div class="kpi-data">
                <span class="label">Clientes</span>
                <span class="value" id="stat-customer-users">0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header-premium" onclick="toggleUserList()" style="cursor: pointer;">
            <div class="header-info-group">
                <div class="header-icon"><i class="fas fa-address-book"></i></div>
                <div class="header-text">
                    <h3>LISTA DE USUARIOS</h3>
                </div>
            </div>
            <div class="header-actions" onclick="event.stopPropagation()">
                <div class="search-box-premium">
                    <i class="fas fa-search"></i>
                    <input type="text" id="user-search" placeholder="Nombre, DNI o Email..." onkeyup="filterUserList(this.value)">
                </div>
                <button class="btn-premium sm" onclick="openModal('modal-create-user')">
                    <i class="fas fa-plus"></i> NUEVO USUARIO
                </button>
                <button class="btn-icon-premium sm" id="user-list-toggle-btn" onclick="toggleUserList()">
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </div>
        <div id="user-list-collapsible" class="collapsible-content">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre Completo</th>
                            <th>Contacto</th>
                            <th>Rol</th>
                            <th>Puntos</th>
                            <th>Saldo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="user-list">
                        <tr><td colspan="6" class="text-center py-20">Cargando base de datos...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <!-- PAGINACIÓN -->
            <div class="pagination-premium flex-row items-center justify-center gap-20 py-20" style="border-top: 1px solid rgba(255,255,255,0.05);">
                <button class="btn-icon-premium sm" onclick="prevUserPage()" id="prev-user-btn" disabled>
                    <i class="fas fa-chevron-left"></i>
                </button>
                <span id="user-page-info" class="text-small text-muted font-bold">Página 1 de 1</span>
                <button class="btn-icon-premium sm" onclick="nextUserPage()" id="next-user-btn" disabled>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- MODAL: CREAR USUARIO ADMIN/STAFF -->
<div id="modal-create-user" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 500px;">
        <span class="close-btn" onclick="closeModal('modal-create-user')"><i class="fas fa-xmark"></i></span>
        <h2 class="text-dorado">ALTA USUARIO</h2>
        
        <form id="adminCreateUserForm" onsubmit="handleAdminCreateUser(event)">
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="admin-user-nombre" placeholder="Nombre/s" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Apellido</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-tag"></i>
                        <input type="text" id="admin-user-apellido" placeholder="Apellido" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="admin-user-email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>DNI</label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="admin-user-dni" placeholder="12345678" maxlength="8" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Rol</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user-shield"></i>
                        <select id="admin-user-rol" class="select-premium" style="width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 15px 15px 15px 45px; border-radius: 12px; outline: none; -webkit-appearance: none; cursor: pointer;" onchange="toggleBranchSelection()">
                            <option value="user" style="background: #111;">Cliente</option>
                            <option value="staff" style="background: #111;">Empleado</option>
                            <option value="local_admin" style="background: #111;">Administrador de Sede</option>
                            <option value="admin" style="background: #111;">Administrador General</option>
                        </select>
                        <i class="fas fa-chevron-down" style="position: absolute; right: 15px; left: auto; color: #666; font-size: 0.7rem; pointer-events: none;"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraseña Temporal</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="admin-user-password" placeholder="Clave temporal" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('admin-user-password', this)"></i>
                    </div>
                </div>
            </div>

            <!-- SELECCIÓN DE SUCURSAL (Solo para Staff o Admin Local) -->
            <div id="branch-selection-row" class="form-row" style="display: none; margin-top: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Sucursal Asignada</label>
                    <div class="input-with-icon">
                        <i class="fas fa-location-dot"></i>
                        <select id="admin-user-sucursal" class="select-premium" style="width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 15px 15px 15px 45px; border-radius: 12px; outline: none; -webkit-appearance: none; cursor: pointer;">
                            <option value="AUTOPASS Central" style="background: #111;">AUTOPASS Central</option>
                            <option value="AUTOPASS Ituzaingó" style="background: #111;">AUTOPASS Ituzaingó</option>
                            <option value="AUTOPASS Castelar" style="background: #111;">AUTOPASS Castelar</option>
                            <option value="AUTOPASS Morón" style="background: #111;">AUTOPASS Morón</option>
                        </select>
                        <i class="fas fa-chevron-down" style="position: absolute; right: 15px; left: auto; color: #666; font-size: 0.7rem; pointer-events: none;"></i>
                    </div>
                </div>
            </div>

            <div class="form-row" style="margin-top: -15px; margin-bottom: 15px;">
                <div class="form-group"></div>
                <div class="form-group">
                    <small style="color: #666; display: block; font-size: 0.65rem; line-height: 1.2;">
                        Min. 8 caracteres, 1 mayúscula y 1 símbolo.
                    </small>
                </div>
            </div>

            <div class="flex-row justify-center mt-20 gap-20">
                <button type="button" class="btn btn-outline" style="padding: 12px 30px; font-size: 0.75rem; min-width: 140px;" onclick="closeModal('modal-create-user')">CANCELAR</button>
                <button type="submit" class="btn btn-primary" style="padding: 12px 30px; font-size: 0.75rem; min-width: 140px;"><i class="fas fa-user-plus"></i> CREAR USUARIO</button>
            </div>
        </form>
    </div>
</div>
