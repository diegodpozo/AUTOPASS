<!-- PESTAÑA: CONFIGURACIÓN -->
<div id="tab-settings" class="tab-view" style="display: none;">
    <div class="settings-grid">
        <!-- SECCIÓN: TARIFARIO -->
        <div class="card">
            <div class="card-header-premium" onclick="toggleRates()" style="cursor: pointer;">
                <div class="header-info-group">
                    <div class="header-icon"><i class="fas fa-hand-holding-dollar"></i></div>
                    <div class="header-text">
                        <h3 style="color: var(--dorado);">TARIFAS</h3>
                    </div>
                </div>
                <i id="rates-chevron" class="fas fa-chevron-down" style="color: var(--dorado); transition: transform 0.3s;"></i>
            </div>
            
            <div id="rates-content" style="max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out;">
                <div class="settings-content">
                    <div class="rates-grid" style="display: grid; grid-template-columns: repeat(2, auto); gap: 20px 60px; justify-content: center;">
                        <div class="form-group-premium" style="width: 180px;">
                            <label>VALOR POR HORA</label>
                            <div class="input-with-icon">
                                <i class="fas fa-clock"></i>
                                <input type="number" id="cfg-precio_hora" class="input-premium" placeholder="0">
                            </div>
                        </div>
                        <div class="form-group-premium" style="width: 180px;">
                            <label>VALOR POR DÍA</label>
                            <div class="input-with-icon">
                                <i class="fas fa-calendar-day"></i>
                                <input type="number" id="cfg-precio_dia" class="input-premium" placeholder="0">
                            </div>
                        </div>
                        <div class="form-group-premium" style="width: 180px;">
                            <label>VALOR POR SEMANA</label>
                            <div class="input-with-icon">
                                <i class="fas fa-calendar-week"></i>
                                <input type="number" id="cfg-precio_semana" class="input-premium" placeholder="0">
                            </div>
                        </div>
                        <div class="form-group-premium" style="width: 180px;">
                            <label>VALOR POR QUINCENA</label>
                            <div class="input-with-icon">
                                <i class="fas fa-calendar-days"></i>
                                <input type="number" id="cfg-precio_quincena" class="input-premium" placeholder="0">
                            </div>
                        </div>
                        <div class="form-group-premium" style="width: 180px;">
                            <label>VALOR MENSUAL</label>
                            <div class="input-with-icon">
                                <i class="fas fa-calendar-check"></i>
                                <input type="number" id="cfg-precio_mes" class="input-premium" placeholder="0">
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex-row justify-center mt-30">
                        <button class="btn btn-primary sm" onclick="saveAllRates()" style="padding: 10px 30px;">
                            ACTUALIZAR TARIFAS
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN: PARÁMETROS DEL SISTEMA -->
        <div class="grid-col" style="display: flex; flex-direction: column; gap: 25px; align-items: center;">
            <div class="card" style="width: 250px;">
                <div class="card-header-premium" onclick="togglePlazas()" style="cursor: pointer;">
                    <div class="header-info-group">
                        <div class="header-icon"><i class="fas fa-gears"></i></div>
                        <h3>PLAZAS</h3>
                    </div>
                    <i id="plazas-chevron" class="fas fa-chevron-down" style="color: var(--dorado); transition: transform 0.3s;"></i>
                </div>
                <div id="plazas-content" style="max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out;">
                    <div class="settings-content" style="display: flex; flex-direction: column; align-items: center; padding: 25px;">
                        <div class="form-group-premium" style="width: 140px; margin-bottom: 0;">
                            <label style="text-align: center;">CAPACIDAD</label>
                            <div class="input-with-icon">
                                <i class="fas fa-car"></i>
                                <input type="number" id="cfg-capacidad_total" class="input-premium" placeholder="20" style="text-align: center; padding-left: 35px; padding-right: 15px;">
                            </div>
                        </div>
                        <button class="btn btn-primary sm mt-20" onclick="saveSystemParam('capacidad_total')" style="padding: 10px 25px;">
                            ACTUALIZAR
                        </button>
                    </div>
                </div>
            </div>

            <!-- ZONA DE PELIGRO -->
            <div class="card danger-zone-card" style="width: 250px; border: none; background: transparent;">
                <div class="settings-content" style="padding: 0; display: flex; justify-content: center;">
                    <button class="btn btn-outline btn-danger sm" onclick="resetSys()" style="width: 100%; padding: 12px !important;">
                        <i class="fas fa-trash-can"></i> REINICIAR SISTEMA
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
